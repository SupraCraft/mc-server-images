name: Player blueprint depot Java 26.3 RDTE

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/player-blueprint-depot-26.3.yml'
      - 'tools/probe_player_blueprint_depot_26_3.py'
      - 'tools/probe_player_blueprint_depot.js'
      - 'tools/probe_blueprint_depot_26_3.py'
      - 'tools/smoke_vanilla_runtime.py'
      - 'tools/install_experimental_prismarine_26_3.sh'
      - 'tools/apply_mineflayer_tick_end_26_3.py'
      - 'probes/structure-capability/redroof-stock-watering-blueprint-depot-v0.1.json'
      - 'probes/26.3-release-identity.json'

permissions:
  contents: write

concurrency:
  group: player-blueprint-depot-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  player-depot-rdte:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Assemble exact 26.3 client stack
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="/tmp/supracraft-prismarine-player-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "PRISMARINE_RUNTIME=$runtime_root/runtime" >> "$GITHUB_ENV"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Run player-facing material-depot rep
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_player_blueprint_depot_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --work-site probes/structure-capability/redroof-stock-watering-blueprint-depot-v0.1.json \
            --output probes/structure-capability/redroof-player-blueprint-depot-26.3-result.json

      - name: Publish compact receipt
        if: always()
        shell: bash
        run: |
          if [[ -f probes/structure-capability/redroof-player-blueprint-depot-26.3-result.json ]]; then
            {
              echo '## Redroof player blueprint/depot RDTE'
              echo
              echo '~~~json'
              cat probes/structure-capability/redroof-player-blueprint-depot-26.3-result.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          test -f probes/structure-capability/redroof-player-blueprint-depot-26.3-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/structure-capability/redroof-player-blueprint-depot-26.3-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain player blueprint-depot RDTE evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
