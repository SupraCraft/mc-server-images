name: Barsoom Java 26.3 two-province checkerboard admission
on:
  pull_request:
    paths:
      - 'fixtures/barsoom/provinces/**'
      - 'tools/qualify_barsoom_checkerboard_263.py'
      - 'tools/test_barsoom_checkerboard_263.py'
      - '.github/workflows/barsoom-checkerboard-263.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barsoom-checkerboard-263-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkerboard:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Determinism and no-override static admission
        run: |
          set -euo pipefail
          python3 -m py_compile fixtures/barsoom/provinces/gen_checkerboard_263.py tools/qualify_barsoom_checkerboard_263.py tools/test_barsoom_checkerboard_263.py
          python3 -m unittest tools/test_barsoom_checkerboard_263.py -v
          mkdir -p "$RUNNER_TEMP/barsoom-checkerboard"
          python3 fixtures/barsoom/provinces/gen_checkerboard_263.py --output "$RUNNER_TEMP/barsoom-checkerboard/pack.zip" --receipt "$RUNNER_TEMP/barsoom-checkerboard/static.json"
      - name: Exact-version native two-seed geographic feature qualification
        run: |
          set -euo pipefail
          for seed in 1811001 4242424242; do
            python3 tools/qualify_barsoom_checkerboard_263.py --evidence probes/26.3-release-identity.json --seed "$seed" --out "$RUNNER_TEMP/barsoom-checkerboard/native-$seed.json"
          done
      - name: Retain exact-revision positive and first-failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barsoom-checkerboard-native-263
          path: |
            ${{ runner.temp }}/barsoom-checkerboard/static.json
            ${{ runner.temp }}/barsoom-checkerboard/native-1811001.json
            ${{ runner.temp }}/barsoom-checkerboard/native-4242424242.json
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        run: echo 'Two fresh-world seeds, same-world mixed biomes, read-only vegetation census; not Mojang graphical HIL or production.' >> "$GITHUB_STEP_SUMMARY"
