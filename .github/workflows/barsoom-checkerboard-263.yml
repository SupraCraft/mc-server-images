name: Barsoom Java 26.3 four-cell checkerboard admission
on:
  pull_request:
    paths:
      - 'fixtures/barsoom/provinces/**'
      - 'tools/qualify_barsoom_checkerboard_263.py'
      - 'tools/test_barsoom_checkerboard_263.py'
      - '.github/workflows/barsoom-checkerboard-263.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barsoom-checkerboard-263-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checkerboard:
    name: four-cell-native-seed-${{ matrix.seed }}
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [1811001, 4242424242]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 node24
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Determinism and no-override static admission
        run: |
          set -euo pipefail
          python3 -m py_compile fixtures/barsoom/provinces/gen_checkerboard_263.py tools/qualify_barsoom_checkerboard_263.py tools/test_barsoom_checkerboard_263.py
          python3 -m unittest tools/test_barsoom_checkerboard_263.py -v
          mkdir -p "$RUNNER_TEMP/barsoom-checkerboard"
          python3 fixtures/barsoom/provinces/gen_checkerboard_263.py --output "$RUNNER_TEMP/barsoom-checkerboard/pack.zip" --receipt "$RUNNER_TEMP/barsoom-checkerboard/static.json"
      - name: Exact-version native four parity cells for independent seed
        run: |
          set -euo pipefail
          python3 tools/qualify_barsoom_checkerboard_263.py --evidence probes/26.3-release-identity.json --seed "${{ matrix.seed }}" --out "$RUNNER_TEMP/barsoom-checkerboard/native-${{ matrix.seed }}.json"
      - name: Retain exact-revision positive and first-failure receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 node24
        with:
          name: barsoom-checkerboard-four-cell-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/barsoom-checkerboard/static.json
            ${{ runner.temp }}/barsoom-checkerboard/native-${{ matrix.seed }}.json
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        run: echo 'Independent fresh-world seed on a separate public runner; four checkerboard parity cells with read-only native biome/vegetation census, not Mojang graphical HIL or production.' >> "$GITHUB_STEP_SUMMARY"
