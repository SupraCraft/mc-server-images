name: worldgen causal microscope frontier hook structure

on:
  pull_request:
    branches: [main]
    paths:
      - 'bench/worldgen/observability/**'
      - 'tools/discover_minecraft_observability.py'
      - 'tools/inventory_modern_microscope_symbols.py'
      - 'tools/inspect_modern_microscope_hook_structure.py'
      - 'tests/test_modern_microscope_hook_structure.py'
      - '.github/workflows/worldgen-causal-microscope-frontier-hook-structure.yml'
  workflow_dispatch:

concurrency:
  group: worldgen-causal-microscope-frontier-hook-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.frontier.outputs.matrix }}
    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enforce public/free execution policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows

      - name: Hook-structure contract controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_modern_microscope_symbol_inventory \
            tests.test_modern_microscope_hook_structure
          python -m py_compile \
            tools/discover_minecraft_observability.py \
            tools/inventory_modern_microscope_symbols.py \
            tools/inspect_modern_microscope_hook_structure.py

      - name: Resolve exact Mojang frontier
        id: frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/discover_minecraft_observability.py resolve \
            --output out/frontier-resolution.json \
            --github-output "$GITHUB_OUTPUT"

  inspect:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '${{ matrix.java_major }}'

      - name: Enforce public/free execution policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows

      - name: Inspect exact selected method bodies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/runtime
          python tools/inspect_modern_microscope_hook_structure.py inspect \
            --channel "${{ matrix.channel }}" \
            --expected-version "${{ matrix.minecraft_version }}" \
            --expected-java "${{ matrix.java_major }}" \
            --work-dir out/runtime \
            --output out/hook-structure.json

      - name: Validate structure-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          doc=json.loads(pathlib.Path("out/hook-structure.json").read_text())
          assert doc["schema"]=="supracraft-causal-hook-structure/1"
          assert doc["qualification_status"]=="structure_only_not_hook_qualified"
          rows={row["id"]:row for row in doc["methods"]}
          expected={
              "server_tick","block_state_write","command_block_neighbor",
              "command_block_tick","command_block_execute",
              "command_dispatch","command_dispatch_prefixed",
          }
          assert set(rows)==expected
          for row in rows.values():
              assert row["instruction_count"]>0
              assert len(row["class_sha256"])==64
              assert len(row["normalized_code_sha256"])==64
          assert not any("packet" in key or "wire" in key for key in rows)
          print(json.dumps({
              "channel":doc["channel"],
              "minecraft_version":doc["minecraft_version"],
              "methods":{
                  key:{
                      "runtime_class":row["runtime_class"],
                      "method_name":row["method_name"],
                      "method_descriptor":row["method_descriptor"],
                      "normalized_code_sha256":row["normalized_code_sha256"],
                      "instruction_count":row["instruction_count"],
                      "method_ref_count":len(row["method_refs"]),
                      "field_ref_count":len(row["field_refs"]),
                  }
                  for key,row in rows.items()
              },
          },indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: causal-microscope-hook-structure-${{ matrix.channel }}
          path: out/hook-structure.json
          retention-days: 14

  compare:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v5
        with:
          pattern: causal-microscope-hook-structure-*
          path: out/hooks
          merge-multiple: false

      - name: Compare exact method structures across frontier
        shell: bash
        run: |
          set -euo pipefail
          python tools/inspect_modern_microscope_hook_structure.py compare \
            --root out/hooks \
            --output out/hook-frontier-comparison.json

      - uses: actions/upload-artifact@v4
        with:
          name: causal-microscope-hook-frontier-comparison
          path: out/hook-frontier-comparison.json
          retention-days: 14
