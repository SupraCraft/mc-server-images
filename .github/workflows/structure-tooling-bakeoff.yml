name: Structure tooling headless bake-off

on:
  workflow_dispatch:
  push:
    branches:
      - probe/structure-tooling-bakeoff
    paths:
      - .github/workflows/structure-tooling-bakeoff.yml
      - tools/probe_structure_tooling.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/structure-tooling-bakeoff.yml
      - tools/probe_structure_tooling.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tool:
          - trimesh
          - cadquery
          - openscad
          - blender
          - freecad
          - vengi

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install common probe dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check trimesh numpy

      - name: Install CadQuery
        if: matrix.tool == 'cadquery'
        continue-on-error: true
        shell: bash
        run: python -m pip install --disable-pip-version-check cadquery

      - name: Install OpenSCAD
        if: matrix.tool == 'openscad'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Install Blender
        if: matrix.tool == 'blender'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Install FreeCAD
        if: matrix.tool == 'freecad'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y freecad

      - name: Install vengi voxconvert
        if: matrix.tool == 'vengi'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          native_url="https://github.com/vengi-voxel/vengi/releases/download/v0.6.0/linux-debian.zip"
          curl -fL "$native_url" -o /tmp/vengi-linux-debian.zip
          echo "6a3be6fef7c6b3385c7f47d12d389395a56f226442d39a34a699d1643500d501  /tmp/vengi-linux-debian.zip" | sha256sum -c -
          rm -rf /tmp/vengi-dist
          mkdir -p /tmp/vengi-dist
          unzip -q /tmp/vengi-linux-debian.zip -d /tmp/vengi-dist
          mapfile -t debs < <(find /tmp/vengi-dist -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install -y "${debs[@]}" || true
          fi

          found="$(command -v vengi-voxconvert || true)"
          if [[ -n "$found" ]]; then
            echo "VENGI_VOXCONVERT=$found" >> "$GITHUB_ENV"
            echo "VENGI_DISTRIBUTION=v0.6.0-native-deb" >> "$GITHUB_ENV"
            exit 0
          fi

          # Ubuntu 24.04 hosted runners currently carry binutils 2.42 while
          # the v0.6.0 Debian artifacts require libbinutils >= 2.46.
          # Qualify the project's small WebAssembly distribution as a
          # substitutable headless fallback rather than weakening the probe.
          wasm_url="https://github.com/vengi-voxel/vengi/releases/download/v0.5.0/emscripten-voxconvert.zip"
          curl -fL "$wasm_url" -o /tmp/vengi-emscripten.zip
          echo "cddabc430f5e0fbca7f557cbadfdeeafe113853047863c62045c1481966ad0fe  /tmp/vengi-emscripten.zip" | sha256sum -c -
          rm -rf /tmp/vengi-wasm
          mkdir -p /tmp/vengi-wasm
          unzip -q /tmp/vengi-emscripten.zip -d /tmp/vengi-wasm
          js="$(find /tmp/vengi-wasm -type f \( -name '*voxconvert*.js' -o -name 'index.js' \) | head -n1 || true)"
          if [[ -z "$js" ]]; then
            find /tmp/vengi-wasm -maxdepth 3 -type f -print
            exit 0
          fi
          cat >/tmp/vengi-voxconvert <<EOF
          #!/usr/bin/env bash
          exec node "$js" "\$@"
          EOF
          chmod +x /tmp/vengi-voxconvert
          echo "VENGI_VOXCONVERT=/tmp/vengi-voxconvert" >> "$GITHUB_ENV"
          echo "VENGI_DISTRIBUTION=v0.5.0-emscripten-fallback" >> "$GITHUB_ENV"

      - name: Run public-safe primitive probe
        shell: bash
        run: |
          mkdir -p "probe-results"
          python tools/probe_structure_tooling.py "${{ matrix.tool }}" \
            --output "probe-results/${{ matrix.tool }}.json"

      - name: Publish individual result
        shell: bash
        run: |
          {
            echo "## ${{ matrix.tool }}"
            echo
            echo '~~~json'
            cat "probe-results/${{ matrix.tool }}.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: structure-tooling-${{ matrix.tool }}
          path: probe-results/${{ matrix.tool }}.json
          if-no-files-found: error

  aggregate:
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: structure-tooling-*
          path: collected
          merge-multiple: true

      - name: Normalize combined evidence
        shell: bash
        run: |
          mkdir -p probes/structure-tooling-bakeoff
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("collected").glob("*.json")):
              rows.append(json.loads(path.read_text(encoding="utf-8")))
          result = {
              "schema": "supracraft.structure-tooling-bakeoff/v0.1",
              "fixture": "synthetic-public-unit-cube",
              "results": sorted(rows, key=lambda row: row["tool"]),
          }
          out = Path("probes/structure-tooling-bakeoff/latest.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Publish aggregate result
        shell: bash
        run: |
          {
            echo "## Structure tooling bake-off"
            echo
            echo '~~~json'
            cat probes/structure-tooling-bakeoff/latest.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain evidence on probe branch
        if: github.event_name == 'push' && github.ref_name == 'probe/structure-tooling-bakeoff'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/structure-tooling-bakeoff/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record structure tooling bake-off"
          git push origin "HEAD:$GITHUB_REF_NAME"
