name: Public no-agent Paper769 synthetic rejoin experiment (one-off)

on:
  push:
    branches:
      - workcell/public-hosting-contract-rep-20261112
    paths:
      - .github/workflows/public-paper769-session-rejoin-oneoff.yml

permissions:
  contents: read

concurrency:
  group: public-paper769-session-rejoin-oneoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  no-agent-rejoin:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Start Paper 1.21.4 without custom agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rejoin"
          docker pull itzg/minecraft-server@sha256:4ab5210150b3fa0f5ece85be5398b4ade95d4c111c0242e0c922ec929efd1ae9
          docker run -d --name public-paper769-noagent-rejoin \
            --publish 127.0.0.1:25565:25565 \
            --mount type=tmpfs,destination=/data,tmpfs-size=3221225472 \
            --memory=6g --cpus=3 \
            -e EULA=TRUE -e TYPE=PAPER -e VERSION=1.21.4 \
            -e PAPER_BUILD=225 -e MEMORY=2G -e ONLINE_MODE=FALSE \
            -e ENABLE_RCON=FALSE -e SPAWN_PROTECTION=0 \
            itzg/minecraft-server@sha256:4ab5210150b3fa0f5ece85be5398b4ade95d4c111c0242e0c922ec929efd1ae9
          docker inspect -f '{{.Image}}' public-paper769-noagent-rejoin > "$RUNNER_TEMP/rejoin/image-id.txt"
          docker port public-paper769-noagent-rejoin > "$RUNNER_TEMP/rejoin/ports.txt"
          grep -Fx '25565/tcp -> 127.0.0.1:25565' "$RUNNER_TEMP/rejoin/ports.txt"
          grep -q '1.21.4' <<< '1.21.4'
      - name: Admit Paper status and install pinned public library in disposable temporary directory
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 45); do
            if python3 tools/minecraft_java_status_oracle.py --port 25565 \
              --expected-version 1.21.4 --implementation paper --expected-protocol 769 \
              --timeout 2 --out "$RUNNER_TEMP/rejoin/status.json" >/dev/null 2>&1; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          mkdir -p "$RUNNER_TEMP/rejoin/npm"
          cd "$RUNNER_TEMP/rejoin/npm"
          npm install --ignore-scripts --no-audit --no-fund --save-exact minecraft-protocol@1.68.0
          cp package-lock.json "$RUNNER_TEMP/rejoin/package-lock.json"
          echo "NODE_PATH=$RUNNER_TEMP/rejoin/npm/node_modules" >> "$GITHUB_ENV"
      - name: Synthetic no-agent same-identity session retirement
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rejoin/rejoin.js" <<'NODE'
          'use strict'
          const fs = require('node:fs')
          const mc = require('minecraft-protocol')
          const attempts = []
          if ('pub_alpha'.length > 16) throw new Error('synthetic username over protocol limit')
          const now = () => new Date().toISOString()
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
          async function session(label, holdMs=1300) {
            return await new Promise(resolve => {
              const rec = {label, started:now(), loginPlay:false, events:[], outcome:'UNKNOWN'}
              attempts.push(rec)
              let settled=false, c, logged=false
              const finish = (outcome) => {
                if (settled) return
                settled=true; rec.outcome=outcome; rec.completed=now()
                clearTimeout(timer)
                try { c?.end() } catch(_){}
                resolve(rec)
              }
              const timer=setTimeout(()=>finish('TIMEOUT'),25000)
              try {
                c=mc.createClient({host:'127.0.0.1',port:25565,username:'pub_alpha',
                                   auth:'offline',version:'1.21.4'})
                c.on('login', () => {
                  logged=true; rec.loginPlay=true
                  rec.events.push({type:'play_login',at:now()})
                  setTimeout(()=>{try{c.end()}catch(e){finish('END_ERROR')}},holdMs)
                })
                c.on('end',(reason)=>{rec.events.push({type:'end',at:now(),reason:String(reason).slice(0,120)});finish(logged?'PLAY_THEN_END':'END_BEFORE_PLAY')})
                c.on('error',(e)=>{rec.events.push({type:'error',at:now(),name:e.name,message:String(e.message).slice(0,160)});finish('ERROR')})
                c.on('kick_disconnect',(reason)=>rec.events.push({type:'kick',at:now(),reason:String(reason).slice(0,160)}))
              } catch(e) {rec.events.push({type:'throw',at:now(),message:String(e.message).slice(0,160)});finish('EXCEPTION')}
            })
          }
          ;(async()=>{
            const first=await session('initial')
            const immediate=await session('immediate_rejoin')
            await wait(3500)
            const delayed=await session('delayed_rejoin')
            const payload={schema:'public-paper769-noagent-same-identity/v1',source:'public synthetic only',
              privateSourceUsed:false,javaVersion:'1.21.4',protocol:769,
              noCustomJavaAgent:true,attempts,
              classification:(first.loginPlay && delayed.loginPlay)?'SUPPORTED_RETURN_WITH_DELAY':'OBSERVED_FAILURE'}
            fs.writeFileSync(process.env.RUNNER_TEMP+'/rejoin/rejoin-receipt.json',JSON.stringify(payload,null,2)+'\n')
            console.log(JSON.stringify({classification:payload.classification,attempts:attempts.map(({label,loginPlay,outcome})=>({label,loginPlay,outcome}))}))
            if(payload.classification!=='SUPPORTED_RETURN_WITH_DELAY')process.exitCode=1
          })().catch(err=>{console.error('HARNESS_FAILURE',err.message);process.exitCode=2})
          NODE
          node "$RUNNER_TEMP/rejoin/rejoin.js"
      - name: Bounded public evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rejoin"
          docker logs --tail 140 public-paper769-noagent-rejoin 2>&1 |
            grep -E '(joined the game|lost connection|logged in|You logged in|Disconnected|Done \()' |
            tail -80 > "$RUNNER_TEMP/rejoin/paper-session-log.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-paper769-noagent-rejoin
          path: |
            ${{ runner.temp }}/rejoin/rejoin-receipt.json
            ${{ runner.temp }}/rejoin/status.json
            ${{ runner.temp }}/rejoin/image-id.txt
            ${{ runner.temp }}/rejoin/ports.txt
            ${{ runner.temp }}/rejoin/paper-session-log.txt
            ${{ runner.temp }}/rejoin/package-lock.json
          if-no-files-found: warn
          retention-days: 3
      - name: Dispose public Paper container
        if: always()
        shell: bash
        run: docker rm -fv public-paper769-noagent-rejoin || true
