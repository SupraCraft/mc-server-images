name: Free Apple Silicon accelerator probe

on:
  workflow_dispatch:
  push:
    branches:
      - qualify/voxel-diffusion-runtime
    paths:
      - .github/workflows/apple-silicon-accel-probe.yml

permissions:
  contents: read

jobs:
  probe:
    # Standard public-repository runner only. Do not replace with *-xlarge:
    # larger runners are billed even for public repositories.
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Fail closed outside a public repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" != "false" ]]; then
            echo "::error::This qualification workflow is authorized only in public repositories."
            exit 78
          fi

      - uses: actions/checkout@v5

      - name: Record Apple Silicon / Metal / CoreML capability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          cat > /tmp/accel_probe.swift <<'SWIFT'
          import Foundation
          import Metal
          import CoreML

          let device = MTLCreateSystemDefaultDevice()
          let metalAvailable = device != nil
          let metalName = device?.name ?? ""
          let lowPower = device?.isLowPower ?? false
          let removable = device?.isRemovable ?? false
          let unified = device?.hasUnifiedMemory ?? false

          let payload: [String: Any] = [
            "metal_available": metalAvailable,
            "metal_device_name": metalName,
            "metal_low_power": lowPower,
            "metal_removable": removable,
            "metal_unified_memory": unified,
            "coreml_framework_loadable": true
          ]
          let data = try JSONSerialization.data(withJSONObject: payload, options: [.prettyPrinted, .sortedKeys])
          print(String(data: data, encoding: .utf8)!)
          SWIFT

          swift /tmp/accel_probe.swift > evidence/apple-silicon-accelerator.json

          python3 - <<'PY'
          import json, os, platform, subprocess
          p = "evidence/apple-silicon-accelerator.json"
          data = json.load(open(p))
          data.update({
              "runner_arch": platform.machine(),
              "runner_os": platform.platform(),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "github_repository": os.environ.get("GITHUB_REPOSITORY"),
              "github_ref": os.environ.get("GITHUB_REF"),
              "standard_runner_label": "macos-26",
              "public_repo_required": True,
          })
          for key, cmd in {
              "system_profiler_hardware": ["system_profiler", "SPHardwareDataType"],
              "system_profiler_display": ["system_profiler", "SPDisplaysDataType"],
          }.items():
              cp = subprocess.run(cmd, text=True, capture_output=True)
              data[key] = cp.stdout[-12000:]
              data[key + "_exit"] = cp.returncode
          with open(p, "w") as f:
              json.dump(data, f, indent=2, sort_keys=True)
          PY

          cat evidence/apple-silicon-accelerator.json

      - name: Publish compact evidence
        shell: bash
        run: |
          {
            echo "## Free public Apple Silicon capability probe"
            echo
            echo "- repository: `$GITHUB_REPOSITORY`"
            echo "- runner: standard `macos-26` (M1 class)"
            echo "- policy: public repository only; paid larger runners forbidden"
            echo
            echo '~~~json'
            cat evidence/apple-silicon-accelerator.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: free-macos26-accelerator-evidence
          path: evidence/apple-silicon-accelerator.json
          retention-days: 7
