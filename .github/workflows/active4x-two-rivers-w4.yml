name: Active 4X Two Rivers W4 Player Interventions
on:
  workflow_dispatch:
  push:
    branches: [feat/named-place-visual-qualification-v1]
    paths:
      - '.github/workflows/active4x-two-rivers-w4.yml'
      - 'tools/active4x_sim.py'
      - 'tools/active4x_trade_w1.py'
      - 'tools/probe_active4x_two_rivers_w4.py'
      - 'tests/test_active4x_w4.py'
      - 'probes/active4x/two-rivers-v0.1.json'
      - 'probes/active4x/two-rivers-w4-interventions-v0.1.json'
permissions:
  contents: write
concurrency:
  group: active4x-two-rivers-w4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-rivers-w4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unit tests
        run: PYTHONPATH=tools python -m unittest -v tests/test_active4x_w4.py
      - name: Run W4 oracle
        run: python tools/probe_active4x_two_rivers_w4.py --base probes/active4x/two-rivers-v0.1.json --w4 probes/active4x/two-rivers-w4-interventions-v0.1.json --output probes/active4x/two-rivers-w4-result.json
      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        run: |
          set -euo pipefail
          test -f probes/active4x/two-rivers-w4-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/active4x/two-rivers-w4-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain Two Rivers W4 intervention evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
