name: Vanilla Java 26.3 datapack presence-chain qualification

on:
  pull_request:
    paths:
      - ".github/workflows/datapack-presence-chain-26.3.yml"
      - "tools/probe_datapack_presence_chain_26_3.py"
      - "tools/probe_mineflayer_presence.js"
      - "tools/install_experimental_prismarine_26_3.sh"
      - "tools/smoke_vanilla_runtime.py"
      - "probes/26.3-release-identity.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble pinned experimental Prismarine stack
        shell: bash
        run: |
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Qualify datapack presence/access/feedback chain
        shell: bash
        run: |
          mkdir -p out
          python tools/probe_datapack_presence_chain_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output out/26.3-datapack-presence-chain.json

      - name: Publish compact evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Minecraft Java 26.3 datapack presence/access/feedback"
            echo
            if test -f out/26.3-datapack-presence-chain.json; then
              echo '~~~json'
              cat out/26.3-datapack-presence-chain.json
              echo '~~~'
            else
              echo "No terminal qualification receipt was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-26.3-datapack-presence-chain
          path: out/26.3-datapack-presence-chain.json
          if-no-files-found: warn
