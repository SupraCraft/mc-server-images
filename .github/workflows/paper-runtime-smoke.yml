name: Paper runtime smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minecraft Java release id
        required: true
        default: "26.3"
      protocol:
        description: Expected Java protocol number
        required: true
        default: "777"
  push:
    branches:
      - probe/paper-26.3-runtime-smoke
    paths:
      - .github/workflows/paper-runtime-smoke.yml
      - tools/smoke_paper_runtime.py

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Resolve inputs
        shell: bash
        run: |
          version="${{ inputs.version }}"
          protocol="${{ inputs.protocol }}"
          [[ -n "$version" ]] || version="26.3"
          [[ -n "$protocol" ]] || protocol="777"
          echo "MC_VERSION=$version" >> "$GITHUB_ENV"
          echo "MC_PROTOCOL=$protocol" >> "$GITHUB_ENV"
      - name: Boot verified Paper build and query status
        shell: bash
        run: |
          python tools/smoke_paper_runtime.py \
            --version "$MC_VERSION" \
            --protocol "$MC_PROTOCOL" \
            --output "probes/$MC_VERSION-paper-runtime-smoke.json"
      - name: Publish compact evidence
        shell: bash
        run: |
          cat "probes/$MC_VERSION-paper-runtime-smoke.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain compact proving result
        if: github.event_name == 'push' && github.ref_name == 'probe/paper-26.3-runtime-smoke'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "probes/$MC_VERSION-paper-runtime-smoke.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record Paper $MC_VERSION runtime smoke"
          git push origin "HEAD:$GITHUB_REF_NAME"
