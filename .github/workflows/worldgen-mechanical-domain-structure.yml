name: worldgen mechanical domain structure candidate
on:
  push:
    branches: [feat/mechanical-domain-structure-v1]
    paths:
      - 'tools/inspect_mechanical_domain_structure.py'
      - 'tests/test_mechanical_domain_structure.py'
      - 'tools/run_mechanical_domain_canary.py'
      - '.github/workflows/worldgen-mechanical-domain-structure.yml'
  pull_request:
    paths:
      - 'tools/inspect_mechanical_domain_structure.py'
      - 'tests/test_mechanical_domain_structure.py'
      - 'tools/run_mechanical_domain_canary.py'
      - '.github/workflows/worldgen-mechanical-domain-structure.yml'
permissions: {contents: read}
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {WORLDGEN_RUNNER_LABEL: ubuntu-latest}
    steps:
      - name: Fail closed outside public standard runners
        run: '[[ "${{ github.event.repository.private }}" == "false" ]] || exit 78'
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Enforce public/free policy
        run: python tools/check_worldgen_public_policy.py --repository-private "${{ github.event.repository.private }}" --runner-label "$WORLDGEN_RUNNER_LABEL" --scan-workflows .github/workflows
      - name: Mechanical structure controls
        run: python -m unittest -v tests.test_mechanical_domain_structure
      - name: Inspect exact Java 26.3 piston structure
        run: |
          mkdir -p out
          python tools/inspect_mechanical_domain_structure.py --work-dir out/runtime --output out/mechanical-structure.json
      - name: Run bounded Java 26.3 mechanical runtime canary
        run: |
          python tools/run_mechanical_domain_canary.py \
            --evidence probes/26.3-release-identity.json \
            --server-jar out/runtime/server.jar \
            --output-dir out/mechanical-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: mechanical-domain-26.3
          path: |
            out/mechanical-structure.json
            out/mechanical-runtime/mechanical-runtime.json
          retention-days: 14
