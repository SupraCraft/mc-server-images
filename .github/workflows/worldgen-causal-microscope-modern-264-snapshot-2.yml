name: worldgen causal microscope modern 26.4 snapshot 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'bench/worldgen/observability/**'
      - 'tools/causal-microscope/modern-26.4-snapshot-2-agent/**'
      - 'tools/run_modern_microscope_canary.py'
      - 'tools/discover_minecraft_observability.py'
      - 'tests/test_causal_microscope_contract.py'
      - '.github/workflows/worldgen-causal-microscope-modern-264-snapshot-2.yml'
  workflow_dispatch:

concurrency:
  group: worldgen-causal-microscope-modern-264-snapshot-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest
      EXPECTED_VERSION: 26.4-snapshot-2
      EXPECTED_JAVA: "25"

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enforce public/free execution policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows

      - name: Contract controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_causal_microscope_contract
          python -m py_compile \
            tools/run_modern_microscope_canary.py \
            tools/discover_minecraft_observability.py

      - name: Build exact snapshot Java 25 observer
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f tools/causal-microscope/modern-26.4-snapshot-2-agent/pom.xml \
            -DskipTests package
          agent="tools/causal-microscope/modern-26.4-snapshot-2-agent/target/causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT.jar"
          bridge="tools/causal-microscope/modern-26.4-snapshot-2-agent/target/causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT-bootstrap.jar"
          AGENT_JAR="$agent" BRIDGE_JAR="$bridge" python - <<'PY'
          import json,os,pathlib,zipfile
          agent=pathlib.Path(os.environ["AGENT_JAR"])
          bridge=pathlib.Path(os.environ["BRIDGE_JAR"])
          assert agent.is_file() and agent.stat().st_size>0
          assert bridge.is_file() and bridge.stat().st_size>0
          with zipfile.ZipFile(agent) as z:
              names=set(z.namelist())
              manifest=z.read("META-INF/MANIFEST.MF").decode(
                  "utf-8",errors="replace"
              ).replace("\r\n ","").replace("\n ","")
          with zipfile.ZipFile(bridge) as z:
              bridge_names=set(z.namelist())
          checks={
              "premain":"Premain-Class: org.supracraft.microscope.Agent" in manifest,
              "boot_class_path":(
                  "Boot-Class-Path: "
                  "causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT-bootstrap.jar"
                  in manifest
              ),
              "bridge_trace_runtime":(
                  "org/supracraft/microscope/TraceRuntime.class" in bridge_names
              ),
              "bridge_no_asm":not any(
                  name.startswith("org/objectweb/asm/") for name in bridge_names
              ),
              "agent_relocated_asm":(
                  "org/supracraft/microscope/internal/asm/ClassReader.class" in names
              ),
              "agent_no_unrelocated_asm":(
                  "org/objectweb/asm/ClassReader.class" not in names
              ),
          }
          print(json.dumps(checks,indent=2,sort_keys=True))
          assert all(checks.values()),checks
          PY
          echo "MICROSCOPE_AGENT=$PWD/$agent" >> "$GITHUB_ENV"

      - name: Re-resolve and probe exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          python tools/discover_minecraft_observability.py probe \
            --channel snapshot \
            --expected-version "$EXPECTED_VERSION" \
            --expected-java "$EXPECTED_JAVA" \
            --work-dir out/discovery \
            --output out/discovery/discovery.json

      - name: Verify discovery against exact adapter profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("out/discovery/discovery.json").read_text())
          m=json.loads(pathlib.Path(
              "bench/worldgen/observability/modern-26.4-snapshot-2-java25-capability-manifest.json"
          ).read_text())
          p=d["artifact_provenance"]
          mp=m["artifact_provenance"]
          assert d["minecraft_version"]==m["minecraft_version"]=="26.4-snapshot-2"
          assert d["java_major"]==m["java_major"]==25
          assert d["symbol_mode"]=="unobfuscated"
          assert p["version_metadata_url"]==mp["version_metadata_url"]
          assert p["server_sha1_expected"]==mp["server_sha1"]
          assert p["server_sha1_observed"]==mp["server_sha1"]
          assert p["server_sha256_observed"]==mp["server_sha256"]
          assert d["qualification_status"]=="discovery_only_not_adapter_qualified"
          print(json.dumps({
              "minecraft_version":d["minecraft_version"],
              "server_sha1":p["server_sha1_observed"],
              "server_sha256":p["server_sha256_observed"],
              "profile_match":True,
          },indent=2,sort_keys=True))
          PY

      - name: Stock exact snapshot canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stock out/instrumented
          python tools/run_modern_microscope_canary.py \
            --evidence out/discovery/discovery.json \
            --server-jar out/discovery/server.jar \
            --output-dir out/stock \
            --expected-version "$EXPECTED_VERSION"

      - name: Instrumented exact snapshot canary
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_modern_microscope_canary.py \
            --evidence out/discovery/discovery.json \
            --server-jar out/discovery/server.jar \
            --output-dir out/instrumented \
            --java-agent "$MICROSCOPE_AGENT" \
            --adapter-id modern-26.4-snapshot-2-java25 \
            --expected-version "$EXPECTED_VERSION"

      - name: Validate observer effect and causal ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json,pathlib
          stock=json.loads(pathlib.Path("out/stock/result.json").read_text())
          inst=json.loads(pathlib.Path("out/instrumented/result.json").read_text())
          assert stock["minecraft_version"]==inst["minecraft_version"]=="26.4-snapshot-2"
          for key in (
              "java_major","canary_pass","target_position",
              "command_block_position","command_sha256",
          ):
              assert stock[key]==inst[key]
          assert stock["instrumented"] is False
          assert inst["instrumented"] is True
          assert stock["canary_pass"] is True
          assert inst["canary_pass"] is True
          assert inst["trace_present"] is True

          rows=[
              json.loads(x)
              for x in pathlib.Path("out/instrumented/trace.jsonl").read_text().splitlines()
              if x.strip()
          ]
          assert [r["seq"] for r in rows]==list(range(1,len(rows)+1))
          assert rows[0]["event_type"]=="trace_start"
          assert rows[-1]["event_type"]=="trace_end"
          assert rows[-1]["data"]["dropped_events"]==0
          counts=collections.Counter(r["event_type"] for r in rows)
          for required in (
              "tick_start","tick_end","block_state_write",
              "command_block_neighbor","command_block_scheduled_tick",
              "command_trigger_start","command_trigger_end","command_dispatch",
          ):
              assert counts[required]>0,(required,counts)

          h=inst["command_sha256"]
          starts=[
              r for r in rows
              if r["event_type"]=="command_trigger_start"
              and r["data"].get("command_sha256")==h
              and [r["data"].get("x"),r["data"].get("y"),r["data"].get("z")]
                 ==inst["command_block_position"]
          ]
          assert starts
          start=starts[0]
          ends=[
              r for r in rows
              if r["event_type"]=="command_trigger_end"
              and r["seq"]>start["seq"]
              and [r["data"].get("x"),r["data"].get("y"),r["data"].get("z")]
                 ==inst["command_block_position"]
          ]
          assert ends
          end=ends[0]
          targets=[
              r for r in rows
              if r["event_type"]=="block_state_write"
              and start["seq"]<r["seq"]<end["seq"]
              and [r["data"].get("x"),r["data"].get("y"),r["data"].get("z")]
                 ==inst["target_position"]
          ]
          assert targets
          target=targets[0]
          assert start["tick"]==target["tick"]==end["tick"]
          scheduled=[
              r for r in rows
              if r["event_type"]=="command_block_scheduled_tick"
              and r["seq"]<start["seq"] and r["tick"]==start["tick"]
              and [r["data"].get("x"),r["data"].get("y"),r["data"].get("z")]
                 ==inst["command_block_position"]
          ]
          neighbours=[
              r for r in rows
              if r["event_type"]=="command_block_neighbor"
              and r["seq"]<start["seq"]
              and [r["data"].get("x"),r["data"].get("y"),r["data"].get("z")]
                 ==inst["command_block_position"]
          ]
          dispatch=[
              r for r in rows
              if r["event_type"]=="command_dispatch"
              and r["data"].get("command_sha256")==h
          ]
          assert scheduled and neighbours and dispatch
          ratio=inst["elapsed_seconds"]/stock["elapsed_seconds"]
          report={
              "schema":"supracraft-modern-microscope-observer-ab/1",
              "minecraft_version":"26.4-snapshot-2",
              "semantic_divergence":False,
              "stock_canary_pass":True,
              "instrumented_canary_pass":True,
              "command_tick":start["tick"],
              "causal_seq":{
                  "neighbor":neighbours[-1]["seq"],
                  "scheduled_tick":scheduled[-1]["seq"],
                  "command_trigger_start":start["seq"],
                  "target_write":target["seq"],
                  "command_trigger_end":end["seq"],
              },
              "event_counts":dict(sorted(counts.items())),
              "dropped_events":0,
              "stock_elapsed_seconds":stock["elapsed_seconds"],
              "instrumented_elapsed_seconds":inst["elapsed_seconds"],
              "elapsed_ratio":round(ratio,6),
              "boundary":"snapshot observer A/B supports this exact canary only; release acceptance is separate and no unobserved semantics are promoted",
          }
          pathlib.Path("out/observer-ab-report.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-microscope-modern-26.4-snapshot-2
          path: |
            bench/worldgen/observability/modern-26.4-snapshot-2-java25-capability-manifest.json
            tools/causal-microscope/modern-26.4-snapshot-2-agent/target/causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT.jar
            tools/causal-microscope/modern-26.4-snapshot-2-agent/target/causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT-bootstrap.jar
            out/discovery/discovery.json
            out/stock/result.json
            out/instrumented/result.json
            out/instrumented/trace.jsonl
            out/instrumented/diagnostic.json
            out/observer-ab-report.json
          retention-days: 14
