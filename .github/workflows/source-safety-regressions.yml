name: Source safety regressions
on:
  pull_request:
    paths:
      - 'tools/mojang_probe_publication.py'
      - 'tests/test_mojang_probe_publication.py'
      - 'tests/filesystem_capabilities.py'
      - 'tests/test_filesystem_capabilities.py'
      - '.github/workflows/mojang-release-probe.yml'
      - '.github/workflows/source-safety-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-safety-regressions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Publication and filesystem capability regressions
        run: |
          python -B -m unittest discover -s tests -p 'test_mojang_probe_publication.py' -v
          python -B -m unittest discover -s tests -p 'test_filesystem_capabilities.py' -v
