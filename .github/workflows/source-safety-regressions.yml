name: Source safety regressions
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'spec/**'
      - '.github/workflows/mojang-release-probe.yml'
      - '.github/workflows/source-safety-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-safety-regressions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned source-test dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Offline regressions and executable contracts
        run: |
          python -B -m unittest discover -s tests -v
          python -B tools/validate_minecraft_hosting_stack.py
          python -B tools/validate_world_activation_transaction.py
          python -B tools/probe_rcon_packet.py
          python -B tools/probe_rcon_mock.py
  action-compatibility:
    needs: offline-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify tools and create tiny transport fixture
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1)'
          java -version 2>&1 | grep -E 'version "25([."]|$)'
          mkdir -p "$RUNNER_TEMP/transport-source"
          printf 'source-action-compatibility\n' > "$RUNNER_TEMP/transport-source/fixture.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-action-transport-fixture
          path: ${{ runner.temp }}/transport-source/fixture.txt
          archive: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-action-transport-fixture
          path: ${{ runner.temp }}/transport-readback
      - name: Independently compare downloaded bytes
        shell: bash
        run: cmp "$RUNNER_TEMP/transport-source/fixture.txt" "$RUNNER_TEMP/transport-readback/fixture.txt"
