          import json,pathlib
          p=pathlib.Path("derived/core-v1.4-clone-input-power-roots-static.json")
          d=json.loads(p.read_text())
          assert d["schema"]=="supracraft-legacy-clone-input-root-snapshot/1"
          assert d["source_graph_sha256"]=="5a5c25a31e2bcdec1f2d7d18cc4dedfc87c5a43e53cab4529e5bcdac0452efb5"
          assert d["source_world_sha256"]=="61092508c78f5dbe36b03a9d0bdb202c5ddfe71f1aada58d62ae81ae93f5a998"
          assert d["clone_direct_typed_wire_ports"]==2
          assert d["upstream_wire_count"]==6
          assert sum(d["saved_upstream_wire_status_counts"].values())+d["unresolved_upstream_wire_states"]==6
          assert d["resolved_six_face_neighbor_positions"]+d["unresolved_six_face_neighbor_positions"]==d["unique_six_face_neighbor_positions"]
          assert sum(d["saved_neighbor_class_counts"].values())==d["resolved_six_face_neighbor_positions"]
          assert d["indirect_opaque_conduction"]=="UNQUALIFIED"
          assert d["spatial_footprint_interpretation"]=="POSSIBLE_TARGET_ONLY_MATERIAL_AND_EXECUTION_UNKNOWN"
          assert isinstance(d["spatial_write_footprint_candidate_overlaps"],dict)
          assert isinstance(d["unresolved_spatial_commands"],dict)
          assert all(v>=0 for v in d["spatial_write_footprint_candidate_overlaps"].values())
          assert d["dynamic_noncompact_commands"]=="UNRESOLVED"
          assert d["runtime_wire_power"]=="NOT_OBSERVED"
          assert d["runtime_command_activation"]=="NOT_OBSERVED"
          assert d["runtime_piston_motion"]=="NOT_OBSERVED"
          assert d["minecraft_26_3_equivalence"]=="NOT_RUN"
          assert d["gameplay_promoted"] is False
          for banned in ('"node_id"','"position"','"command"','"target_position"','original-world.zip'):
              assert banned not in p.read_text(), "source data leaked"
          print("CORE_INPUT_WIRE_ROOT_SNAPSHOT_STATIC_ONLY",json.dumps({
              "wire_count":d["upstream_wire_count"],
              "wire_saved_status":d["saved_upstream_wire_status_counts"],
              "neighbors_resolved":d["resolved_six_face_neighbor_positions"],
              "neighbor_classes":d["saved_neighbor_class_counts"],
              "authored_contact_writes":d["compact_writes_at_or_near_clone_input"],
              "spatial_candidate_overlaps":d["spatial_write_footprint_candidate_overlaps"],
              "unresolved_spatial":d["unresolved_spatial_commands"],
              "runtime":"NOT_RUN"
