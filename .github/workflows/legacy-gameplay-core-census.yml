name: Legacy gameplay CORE derived motif census

on:
  push:
    branches:
      - feat/legacy-gameplay-motif-discovery-20261022
    paths:
      - '.github/workflows/legacy-gameplay-core-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-original-188-derived-only:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest
      SOURCE_SHA256: 61092508c78f5dbe36b03a9d0bdb202c5ddfe71f1aada58d62ae81ae93f5a998

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enforce free/public source policy
        run: |
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows
      - name: Install existing pinned NBT parser
        run: python -m pip install --disable-pip-version-check nbtlib==2.0.4
      - name: Validate the synthetic negative corpus first
        run: python -m unittest discover -s tests -p 'test_classify_legacy_gameplay_motifs.py' -v
      - name: Rehydrate only pinned CC-BY-SA CORE v1.4 original
        run: |
          python tools/intake_open_reference_world.py \
            --world-id reference.core.v1.4 \
            --mediafire-page 'https://www.mediafire.com/file/un9wjqh99u3uu37/CORE+-+by+UnlikelyWaffle+%5Bv1.4%5D.zip/file' \
            --source-page 'https://www.minecraftforum.net/forums/mapping-and-modding-java-edition/maps/2432763-core-puzzle-adventure-map' \
            --license 'CC-BY-SA-4.0' \
            --attribution 'CORE by UnlikelyWaffle; source forum page and creator YouTube attribution requested.' \
            --output-dir source/core
      - name: Verify exact original artifact before decoding
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path("source/core/original-world.zip")
          r=json.loads(pathlib.Path("source/core/intake-receipt.json").read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest==r["original_sha256"]==os.environ["SOURCE_SHA256"], "source hash mismatch"
          assert r["license"]=="CC-BY-SA-4.0" and r["analysis_blind"] is True
          assert r["human_feedback_labels_loaded"] is False
          assert r["level_dat"]["region_file_count"] > 0
          print("PINNED_ORIGINAL_PASS", digest)
          PY
      - name: Recover existing CORE v1.4 source-era causal graph
        run: |
          mkdir -p ephemeral derived
          python tools/analyze_legacy_causal_machinery.py \
            --world-zip source/core/original-world.zip \
            --output ephemeral/legacy-core-causal-graph.json > ephemeral/legacy-graph-console.txt
      - name: Extract aggregate motif signature candidates
        run: |
          python tools/classify_legacy_gameplay_motifs.py \
            --graph ephemeral/legacy-core-causal-graph.json \
            --output derived/core-v1.4-gameplay-motifs.json
      - name: Recover typed mechanical ports from pinned complete graph (static only)
        run: |
          python -m tools.rank_legacy_electromechanical_witnesses \
            --graph ephemeral/legacy-core-causal-graph.json \
            --expected-graph-sha256 5a5c25a31e2bcdec1f2d7d18cc4dedfc87c5a43e53cab4529e5bcdac0452efb5 \
            --signature 2481c9098598b179b312d89dd7ef1d03b2401a2b1ae84dee5908e0eb6be50794 \
            --output derived/core-v1.4-directional-piston-static.json
      - name: Independently guard mechanical derivative, privacy and nonpromotion
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("derived/core-v1.4-directional-piston-static.json")
          o=json.loads(p.read_text())
          assert o["schema"]=="supracraft-legacy-electromechanical-witness-rank/1"
          assert o["source_graph_sha256"]=="5a5c25a31e2bcdec1f2d7d18cc4dedfc87c5a43e53cab4529e5bcdac0452efb5"
          assert o["mechanical_component_occurrences"]==2, "unexpected original structural census"
          assert o["mechanical_signature_count"]==1
          assert o["native_original_version_execution"]=="NOT_RUN"
          assert o["minecraft_26_3_equivalence"]=="NOT_RUN"
          assert o["causal_power_or_motion_proven"] is False
          allowed={"DIRECT_DUST_TO_PISTON_STATIC_CANDIDATE",
                   "ORIENTED_REPEATER_TO_PISTON_STATIC_CANDIDATE",
                   "NO_NAMED_PISTON_INPUT"}
          assert o["signatures"] and all(x["disposition"] in allowed for x in o["signatures"])
          serialized=p.read_text()
          for private in ('"node_id"','"position"','"command"','"target_position"','original-world.zip'):
              assert private not in serialized, "raw source/position privacy failure"
          print("PINNED_CORE_DIRECTIONAL_STATIC_ONLY",json.dumps({
              "occurrences":o["mechanical_component_occurrences"],
              "directional_subtypes":o["mechanical_directional_subtype_count"],
              "outcomes":[{"disposition":x["disposition"],"count":x["occurrences"],
                           "direct":x["direct_wire_to_piston_edges"],
                           "front":x["oriented_repeater_to_piston_edges"],
                           "rear":x["oriented_wire_to_repeater_edges"]} for x in o["signatures"]]
          },sort_keys=True))
          PY
      - name: Fail-closed nonpromotion and derived-only checks
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,collections
          graph=json.loads(pathlib.Path("ephemeral/legacy-core-causal-graph.json").read_text())
          out=json.loads(pathlib.Path("derived/core-v1.4-gameplay-motifs.json").read_text())
          assert graph["schema"]=="supracraft-legacy-causal-machinery/1"
          assert out["node_count"]==graph["node_count"] and out["node_count"]>3000
          assert out["signature_count"]>0 and out["connected_candidate_count"]>0
          assert all(p["classification"]=="STATIC_CANDIDATE_ONLY" for p in out["patterns"])
          assert not any(p["runtime_proven"] or p["uplift_accepted"] for p in out["patterns"])
          serialized=json.dumps(out)
          assert '"position"' not in serialized and '"command"' not in serialized
          assert '"node_id"' not in serialized and '"target_position"' not in serialized
          print(json.dumps({
            "source_world_sha256": "61092508c78f5dbe36b03a9d0bdb202c5ddfe71f1aada58d62ae81ae93f5a998",
            "graph_sha256": out["source_graph_sha256"],
            "source_node_count":out["node_count"],
            "connected_candidate_count":out["connected_candidate_count"],
            "signature_count":out["signature_count"],
            "cross_domain_signature_count":sum(p["cross_domain"] for p in out["patterns"]),
            "representative_signature_classes": [
               {"signature_sha256":p["signature_sha256"],"occurrences":p["occurrences"],
                "domains":p["domains"],"candidate_edge_types":p["candidate_edge_types"]}
               for p in sorted(out["patterns"],key=lambda p:(-p["occurrences"],p["signature_sha256"]))[:8]
            ],
            "acceptance":"STATIC_CANDIDATE_ONLY"
          },indent=2,sort_keys=True))
          PY
      - name: Preserve only attributed aggregate derivatives
        uses: actions/upload-artifact@v4
        with:
          name: core-188-gameplay-motif-derived-only
          path: |
            derived/core-v1.4-gameplay-motifs.json
            derived/core-v1.4-directional-piston-static.json
            source/core/ATTRIBUTION.md
          retention-days: 14
