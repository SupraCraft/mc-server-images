          PY
      - name: Source-only directed legacy sensor to command witness ranking
        run: |
          python -m tools.rank_legacy_typed_sensor_command_witnesses \
            --graph ephemeral/legacy-core-causal-graph.json \
            --expected-graph-sha256 5a5c25a31e2bcdec1f2d7d18cc4dedfc87c5a43e53cab4529e5bcdac0452efb5 \
            --output derived/core-v1.4-typed-sensor-command-candidates-static.json
      - name: Independently guard typed sensor/command source evidence and no-promotion boundary
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("derived/core-v1.4-typed-sensor-command-candidates-static.json")
          d=json.loads(p.read_text())
          assert d["schema"]=="supracraft-legacy-typed-sensor-command-candidates/1"
          assert d["source_graph_sha256"]=="5a5c25a31e2bcdec1f2d7d18cc4dedfc87c5a43e53cab4529e5bcdac0452efb5"
          assert d["analysis"]=="original_1_8_8_source_static_directional_sensor_command_paths"
          assert d["accepted_path_count"]==sum(d["accepted_sensor_command_path_counts"].values())
          assert d["accepted_path_count"]==sum(d["source_command_effect_class_path_counts"].values())
          assert sum(d["original_mutation_verb_path_counts"].values())==sum(
              count for label,count in d["source_command_effect_class_path_counts"].items()
