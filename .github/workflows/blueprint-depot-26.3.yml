name: Blueprint depot Java 26.3 RDTE

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/blueprint-depot-26.3.yml'
      - 'tools/probe_blueprint_depot_26_3.py'
      - 'tools/smoke_vanilla_runtime.py'
      - 'probes/structure-capability/redroof-stock-watering-blueprint-depot-v0.1.json'
      - 'probes/26.3-release-identity.json'

permissions:
  contents: write

concurrency:
  group: blueprint-depot-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blueprint-depot-rdte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Run bounded blueprint/depot construction rep
        shell: bash
        run: |
          set -euo pipefail
          python tools/probe_blueprint_depot_26_3.py             --evidence probes/26.3-release-identity.json             --projection probes/structure-capability/redroof-stock-watering-blueprint-depot-v0.1.json             --output probes/structure-capability/redroof-stock-watering-blueprint-depot-26.3-result.json

      - name: Publish compact receipt
        if: always()
        shell: bash
        run: |
          if [[ -f probes/structure-capability/redroof-stock-watering-blueprint-depot-26.3-result.json ]]; then
            {
              echo '## Redroof blueprint/depot work-site RDTE'
              echo
              echo '~~~json'
              cat probes/structure-capability/redroof-stock-watering-blueprint-depot-26.3-result.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          test -f probes/structure-capability/redroof-stock-watering-blueprint-depot-26.3-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/structure-capability/redroof-stock-watering-blueprint-depot-26.3-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain blueprint-depot RDTE evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
