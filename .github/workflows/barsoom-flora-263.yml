name: Barsoom 26.3 vanilla five-species flora canary
on:
  pull_request:
    paths:
      - 'fixtures/barsoom/flora/**'
      - 'tools/qualify_barsoom_flora_263.py'
      - 'tools/test_barsoom_flora_263.py'
      - '.github/workflows/barsoom-flora-263.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-flora:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Static and deterministic build
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_barsoom_flora_263.py -v
          python3 -m py_compile fixtures/barsoom/flora/gen_flora_263.py tools/qualify_barsoom_flora_263.py
          mkdir -p "$RUNNER_TEMP/barsoom-flora"
          python3 fixtures/barsoom/flora/gen_flora_263.py --output "$RUNNER_TEMP/barsoom-flora/pack.zip" --manifest "$RUNNER_TEMP/barsoom-flora/static.json"
      - name: Official 26.3 world, block predicates and restart
        run: |
          set -euo pipefail
          python3 tools/qualify_barsoom_flora_263.py --evidence probes/26.3-release-identity.json --out "$RUNNER_TEMP/barsoom-flora/native.json"
      - name: Retain compact evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barsoom-flora-263-receipts
          path: |
            ${{ runner.temp }}/barsoom-flora/static.json
            ${{ runner.temp }}/barsoom-flora/native.json
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        run: echo 'Vanilla five-species fixtures only; natural distribution, custom art, human gameplay and production deployment are not qualified.' >> "$GITHUB_STEP_SUMMARY"
