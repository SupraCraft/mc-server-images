name: Vanilla runtime smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minecraft Java release id
        required: true
        default: "26.3"
  push:
    branches:
      - probe/vanilla-26.3-runtime-smoke
    paths:
      - .github/workflows/vanilla-runtime-smoke.yml
      - tools/smoke_vanilla_runtime.py

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Resolve smoke version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="26.3"
          fi
          echo "MC_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install required Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Boot verified vanilla server and query status
        shell: bash
        run: |
          test -f "probes/$MC_VERSION-release-identity.json"
          python tools/smoke_vanilla_runtime.py             --evidence "probes/$MC_VERSION-release-identity.json"             --output "probes/$MC_VERSION-vanilla-runtime-smoke.json"

      - name: Publish compact evidence to job summary
        shell: bash
        run: |
          {
            echo "## Minecraft $MC_VERSION vanilla runtime smoke"
            echo
            echo '~~~json'
            cat "probes/$MC_VERSION-vanilla-runtime-smoke.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain compact proving result
        if: github.event_name == 'push' && github.ref_name == 'probe/vanilla-26.3-runtime-smoke'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "probes/$MC_VERSION-vanilla-runtime-smoke.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record vanilla $MC_VERSION runtime smoke"
          git push origin "HEAD:$GITHUB_REF_NAME"
