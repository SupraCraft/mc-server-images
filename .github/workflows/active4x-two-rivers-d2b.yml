name: Active 4X Two Rivers D2B Actor Pool

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/active4x-two-rivers-d2b.yml'
      - 'deploy/active4x-two-rivers/d2a/**'
      - 'deploy/active4x-two-rivers/d2b/**'
      - 'tools/probe_active4x_two_rivers_d2b.sh'
      - 'tools/active4x_persistence_w5.py'
      - 'tools/install_experimental_prismarine_26_3.sh'
      - 'tools/apply_mineflayer_tick_end_26_3.py'
      - 'probes/mineflayer-runtime/**'

permissions:
  contents: write

concurrency:
  group: active4x-two-rivers-d2b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-rivers-d2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Qualify bounded actor-adapter pool
        shell: bash
        run: |
          set -euo pipefail
          bash tools/probe_active4x_two_rivers_d2b.sh             probes/active4x/two-rivers-d2b-result.json

      - name: Collect non-authoritative runtime witness
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/active4x
          cid="$(docker compose -p supracraft_two_rivers_d2b_ci -f deploy/active4x-two-rivers/d2a/compose.yaml -f deploy/active4x-two-rivers/d2b/compose.d2b.yaml ps -q actor-adapter 2>/dev/null || true)"
          if [[ -n "$cid" ]]; then
            docker cp "$cid:/actor-state/visual-witness.json" artifacts/active4x/two-rivers-d2b-visual-witness.json 2>/dev/null || true
          fi

      - name: Upload runtime witness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-rivers-d2b-runtime-witness
          path: artifacts/active4x/two-rivers-d2b-visual-witness.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish compact receipt
        if: always()
        shell: bash
        run: |
          if [[ -f probes/active4x/two-rivers-d2b-result.json ]]; then
            {
              echo '## Two Rivers active 4X D2B actor pool'
              echo
              echo '~~~json'
              cat probes/active4x/two-rivers-d2b-result.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          test -f probes/active4x/two-rivers-d2b-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/active4x/two-rivers-d2b-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain Two Rivers D2B actor-pool evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
