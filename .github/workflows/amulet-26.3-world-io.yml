name: Amulet Java 26.3 world IO

on:
  workflow_dispatch:
  push:
    branches:
      - probe/amulet-26.3-world-io
    paths:
      - .github/workflows/amulet-26.3-world-io.yml
      - tools/probe_amulet_26_3.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/amulet-26.3-world-io.yml
      - tools/probe_amulet_26_3.py

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install pinned Amulet-Core
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "amulet-core==1.9.49"
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("amulet-core") == "1.9.49"
          PY

      - name: Run Java 26.3 world IO qualification
        shell: bash
        run: |
          mkdir -p probes/amulet
          python tools/probe_amulet_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output probes/amulet/26.3-world-io.json

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          if [[ -f probes/amulet/26.3-world-io.json ]]; then
            {
              echo "## Amulet-Core 1.9.49 / Minecraft Java 26.3"
              echo
              echo '~~~json'
              cat probes/amulet/26.3-world-io.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amulet-26.3-world-io
          path: probes/amulet/26.3-world-io.json
          if-no-files-found: warn

      - name: Retain compact evidence on probe branch
        if: always() && github.event_name == 'push' && github.ref_name == 'probe/amulet-26.3-world-io'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/amulet/26.3-world-io.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record Amulet 26.3 world IO"
          git push origin "HEAD:$GITHUB_REF_NAME"
