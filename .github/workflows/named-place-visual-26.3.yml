name: Named-place visual Java 26.3 smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/named-place-visual-26.3.yml'
      - 'tools/probe_named_place_visual.js'
      - 'tools/probe_named_place_visual_26_3.py'
      - 'tools/install_experimental_prismarine_26_3.sh'
      - 'tools/apply_mineflayer_tick_end_26_3.py'
      - 'tools/apply_prismarine_viewer_26_3_assets_fallback.py'
      - 'probes/mineflayer-runtime/**'
      - 'probes/26.3-release-identity.json'

concurrency:
  group: named-place-visual-26-3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Assemble exact 26.3 client stack
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          npm --prefix "$runtime_root/runtime" install --no-save \
            prismarine-viewer@1.33.0 \
            github:PrismarineJS/node-canvas-webgl#c183e0a8e5ad8bdc2f1e4f3c1ba0b2592ad952f0
          python tools/apply_prismarine_viewer_26_3_assets_fallback.py \
            "$runtime_root/runtime/node_modules/prismarine-viewer"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Install headless OpenGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dev libglu1-mesa-dev libglew-dev libxi-dev mesa-utils

      - name: Confirm headless renderer
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          node - <<'NODE'
          const viewer=require('prismarine-viewer/package.json')
          const canvasWebgl=require('node-canvas-webgl/package.json')
          console.log(JSON.stringify({viewer:viewer.version,nodeCanvasWebgl:canvasWebgl.version},null,2))
          NODE

      - name: Exact server-client walk and render smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/named-place-visual"
          mkdir -p "$RUNNER_TEMP/named-place-visual"
          xvfb-run -a -s "-ac -screen 0 1280x1024x24" \
            python tools/probe_named_place_visual_26_3.py \
              --evidence probes/26.3-release-identity.json \
              --output-dir "$RUNNER_TEMP/named-place-visual"

      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/named-place-visual/visual-receipt.json" ]]; then
            {
              echo '## Named-place visual Java 26.3 smoke'
              echo
              echo '~~~json'
              cat "$RUNNER_TEMP/named-place-visual/visual-receipt.json"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain visual evidence on probe branch
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probes/named-place-visual/26.3-smoke
          if compgen -G "$RUNNER_TEMP/named-place-visual/*" > /dev/null; then
            cp "$RUNNER_TEMP"/named-place-visual/* probes/named-place-visual/26.3-smoke/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/named-place-visual/26.3-smoke
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain named-place visual smoke evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload derived visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: named-place-visual-26.3-smoke
          path: |
            ${{ runner.temp }}/named-place-visual/visual-receipt.json
            ${{ runner.temp }}/named-place-visual/*.jpg
          retention-days: 14
          if-no-files-found: warn
