name: Named-place visual Java 26.3 smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/named-place-visual-26.3.yml'
      - 'tools/probe_named_place_visual.js'
      - 'tools/probe_named_place_visual_26_3.py'
      - 'tools/install_experimental_prismarine_26_3.sh'
      - 'tools/apply_mineflayer_tick_end_26_3.py'
      - 'tools/install_prismarine_viewer_local_26_3.sh'
      - 'tools/install_prismarine_viewer_exact_26_3.sh'
      - 'patches/prismarine-viewer/**'
      - 'patches/prismarine-viewer-exact/**'
      - 'probes/mineflayer-runtime/**'
      - 'probes/26.3-release-identity.json'

concurrency:
  group: named-place-visual-26-3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install headless OpenGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dev libglu1-mesa-dev libglew-dev libxi-dev mesa-utils \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ffmpeg

      - name: Assemble exact 26.3 client stack
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "PRISMARINE_RUNTIME=$runtime_root/runtime" >> "$GITHUB_ENV"

      - name: Build exact-26.3 Prismarine Viewer locally
        shell: bash
        run: |
          set -euo pipefail
          viewer_root="/tmp/supracraft-prismarine-viewer-26.3"
          bash tools/install_prismarine_viewer_exact_26_3.sh \
            "$viewer_root" "$PRISMARINE_RUNTIME"
          cat "$viewer_root/build-receipt.json"
          echo "PRISMARINE_VIEWER_ROOT=$viewer_root" >> "$GITHUB_ENV"
          echo "NODE_PATH=$viewer_root/local-node_modules:$PRISMARINE_RUNTIME/node_modules" >> "$GITHUB_ENV"

      - name: Confirm headless renderer
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          node - <<'NODE'
          const viewer=require('prismarine-viewer/package.json')
          const canvasWebgl=require('prismarine-viewer/node_modules/node-canvas-webgl/package.json')
          const { getVersion }=require('prismarine-viewer/viewer/lib/version')
          console.log(JSON.stringify({
            viewer:viewer.version,
            nodeCanvasWebgl:canvasWebgl.version,
            exactClient:'26.3',
            renderAssets:getVersion('26.3')
          },null,2))
          if (getVersion('26.3') !== '26.3') process.exit(2)
          NODE

      - name: Exact server-client walk and render smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/named-place-visual"
          mkdir -p "$RUNNER_TEMP/named-place-visual"
          xvfb-run -a -s "-ac -screen 0 1280x1024x24" \
            python tools/probe_named_place_visual_26_3.py \
              --evidence probes/26.3-release-identity.json \
              --output-dir "$RUNNER_TEMP/named-place-visual"

      - name: Encode short traversal walkthrough
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          frames="$RUNNER_TEMP/named-place-visual/walkthrough-frames"
          test -d "$frames"
          test "$(find "$frames" -maxdepth 1 -name '*.jpg' | wc -l)" -ge 6
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 6 -pattern_type glob -i "$frames/*.jpg" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            "$RUNNER_TEMP/named-place-visual/redroof-walkthrough.mp4"
          test -s "$RUNNER_TEMP/named-place-visual/redroof-walkthrough.mp4"

      - name: Publish receipt
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/named-place-visual/visual-receipt.json" ]]; then
            {
              echo '## Named-place visual Java 26.3 smoke'
              echo
              echo '~~~json'
              cat "$RUNNER_TEMP/named-place-visual/visual-receipt.json"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain visual evidence on probe branch
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probes/named-place-visual/26.3-smoke
          if [[ -d "$RUNNER_TEMP/named-place-visual" ]]; then
            find "$RUNNER_TEMP/named-place-visual" -maxdepth 1 -type f \
              -exec cp {} probes/named-place-visual/26.3-smoke/ \;
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/named-place-visual/26.3-smoke
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain named-place visual smoke evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload derived visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: named-place-visual-26.3-smoke
          path: |
            ${{ runner.temp }}/named-place-visual/visual-receipt.json
            ${{ runner.temp }}/named-place-visual/*.jpg
            ${{ runner.temp }}/named-place-visual/*.mp4
            ${{ runner.temp }}/named-place-visual/*.zip
            ${{ runner.temp }}/named-place-visual/*-hil-receipt.json
          retention-days: 14
          if-no-files-found: warn
