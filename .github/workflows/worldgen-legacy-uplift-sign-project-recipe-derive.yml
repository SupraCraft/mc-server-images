name: legacy uplift sign project recipe derive

on:
  workflow_dispatch:
  push:
    branches:
      - feat/legacy-uplift-263-v1
    paths:
      - 'tools/derive_sign_op_features_project_recipe.py'
      - '.github/workflows/worldgen-legacy-uplift-sign-project-recipe-derive.yml'

concurrency:
  group: legacy-uplift-sign-project-recipe-derive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive exact Sprint project recipe
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/sprint"
          old="b674e09699818878749570760444ed7147fea3dc"
          new="93cdfcff9f2462313de4d568f169c0e442d94e42"
          git init "$repo"
          git -C "$repo" remote add origin https://github.com/jarrodmmoore/Sprint-Racer-Dev.git
          git -C "$repo" fetch --depth=1 origin "$old"
          git -C "$repo" fetch --depth=1 origin "$new"
          python tools/derive_sign_op_features_project_recipe.py \
            --repo "$repo" --old "$old" --new "$new" \
            --output "$RUNNER_TEMP/sign-project-recipe.json"
          echo SUPRACRAFT_SIGN_PROJECT_RECIPE_DERIVE_PASS
      - name: Upload derived recipe
        uses: actions/upload-artifact@v4
        with:
          name: sprint-sign-op-features-project-recipe
          path: ${{ runner.temp }}/sign-project-recipe.json
          retention-days: 14
          if-no-files-found: error
