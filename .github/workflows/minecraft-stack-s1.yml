name: Minecraft stack S1 VanillaCord

on:
  push:
    paths:
      - 'tools/probe_minecraft_stack_s1.sh'
      - '.github/workflows/minecraft-stack-s1.yml'
  pull_request:
    paths:
      - 'tools/probe_minecraft_stack_s1.sh'
      - '.github/workflows/minecraft-stack-s1.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  s1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: bash tools/probe_minecraft_stack_s1.sh
