name: worldgen datapack causal controls

on:
  pull_request:
    paths:
      - 'tools/analyze_datapack_causal_semantics.py'
      - 'tests/test_worldgen_datapack_causal_semantics.py'
      - '.github/workflows/worldgen-datapack-causal-controls.yml'
  push:
    branches:
      - plan/worldgen-benchmark-agent-dispatch
    paths:
      - 'tools/analyze_datapack_causal_semantics.py'
      - 'tests/test_worldgen_datapack_causal_semantics.py'
      - '.github/workflows/worldgen-datapack-causal-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enforce public/free execution policy
        run: |
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows

      - name: Run datapack causal controls
        run: python -m unittest -v tests.test_worldgen_datapack_causal_semantics
