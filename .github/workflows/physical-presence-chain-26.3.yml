name: Vanilla Java 26.3 physical presence-chain qualification

on:
  workflow_dispatch:
  push:
    branches:
      - probe/26.3-physical-presence-chain
    paths:
      - .github/workflows/physical-presence-chain-26.3.yml
      - tools/probe_physical_presence_chain_26_3.py
      - tools/probe_mineflayer_presence.js
      - tools/smoke_vanilla_runtime.py
      - tools/install_experimental_prismarine_26_3.sh
      - probes/26.3-release-identity.json
      - probes/mineflayer-runtime/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/physical-presence-chain-26.3.yml
      - tools/probe_physical_presence_chain_26_3.py
      - tools/probe_mineflayer_presence.js

permissions:
  contents: read

concurrency:
  group: physical-presence-chain-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble pinned experimental Prismarine stack
        shell: bash
        run: |
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Qualify physical presence/access/feedback chain
        shell: bash
        run: |
          mkdir -p out
          python tools/probe_physical_presence_chain_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output out/26.3-physical-presence-chain.json

      - name: Publish compact evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Minecraft Java 26.3 physical presence/access/feedback"
            echo
            if test -f out/26.3-physical-presence-chain.json; then
              echo '~~~json'
              cat out/26.3-physical-presence-chain.json
              echo '~~~'
            else
              echo "No terminal qualification receipt was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-26.3-physical-presence-chain
          path: out/26.3-physical-presence-chain.json
          if-no-files-found: warn
