name: Experimental Prismarine Java 26.3 physical placement

on:
  workflow_dispatch:
  push:
    branches:
      - probe/mineflayer-26.3-experimental-stack
    paths:
      - .github/workflows/mineflayer-26.3-placement.yml
      - tools/probe_mineflayer_26_3.py
      - tools/probe_mineflayer_place.js
      - probes/mineflayer-runtime/package.json
      - probes/mineflayer-runtime/experimental-stack.json
      - tools/install_experimental_prismarine_26_3.sh
      - tools/apply_mineflayer_tick_end_26_3.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mineflayer-26.3-placement.yml
      - tools/probe_mineflayer_26_3.py
      - tools/probe_mineflayer_place.js
      - probes/mineflayer-runtime/package.json
      - probes/mineflayer-runtime/experimental-stack.json
      - tools/install_experimental_prismarine_26_3.sh

permissions:
  contents: write

concurrency:
  group: experimental-prismarine-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble pinned experimental Prismarine stack
        shell: bash
        run: |
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          cp "$runtime_root/runtime/package-lock.json" probes/mineflayer-runtime/experimental-package-lock.json
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"
          echo "PROVIDER_VARIANT=experimental-prismarine-26.3-stack" >> "$GITHUB_ENV"

      - name: Run physical placement qualification
        shell: bash
        run: |
          mkdir -p probes/mineflayer
          python tools/probe_mineflayer_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output probes/mineflayer/26.3-stone-placement.json

      - name: Publish evidence
        shell: bash
        run: |
          {
            echo "## Experimental Prismarine stack / Minecraft Java 26.3 physical placement"
            echo
            echo '~~~json'
            cat probes/mineflayer/26.3-stone-placement.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: experimental-prismarine-26.3-stone-placement
          path: probes/mineflayer/26.3-stone-placement.json
          if-no-files-found: error

      - name: Retain evidence and dependency lock
        if: always() && github.event_name == 'push' && github.ref_name == 'probe/mineflayer-26.3-experimental-stack'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f probes/mineflayer-runtime/experimental-package-lock.json ]]; then
            git add probes/mineflayer-runtime/experimental-package-lock.json
          fi
          if [[ -f probes/mineflayer/26.3-stone-placement.json ]]; then
            git add probes/mineflayer/26.3-stone-placement.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record experimental Prismarine 26.3 placement"
          git push origin "HEAD:$GITHUB_REF_NAME"
