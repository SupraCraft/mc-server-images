name: SigLIP CPU critic family interview (public free-tier)
on:
  pull_request:
    paths:
      - 'tools/interview_siglip_cpu.py'
      - '.github/workflows/siglip-candidate-interview.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: siglip-critic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-siglip:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.53.3' 'pillow==11.2.1' 'sentencepiece==0.2.1' 'protobuf==5.29.5'
      - name: First independent SigLIP visual interview
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/siglip"
          python -B tools/interview_siglip_cpu.py --out "$RUNNER_TEMP/siglip/siglip-receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: independent-siglip-cpu-interview
          path: ${{ runner.temp }}/siglip/siglip-receipt.json
          retention-days: 2
          if-no-files-found: warn
