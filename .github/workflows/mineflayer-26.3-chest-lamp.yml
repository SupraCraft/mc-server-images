name: Experimental Prismarine Java 26.3 chest and lamp placement

on:
  workflow_dispatch:
  push:
    branches:
      - probe/mineflayer-26.3-chest-lamp
    paths:
      - .github/workflows/mineflayer-26.3-chest-lamp.yml
      - tools/probe_mineflayer_top_place.js
      - tools/probe_mineflayer_top_place_26_3.py
      - probes/mineflayer-runtime/experimental-stack.json
      - tools/install_experimental_prismarine_26_3.sh
      - tools/apply_mineflayer_tick_end_26_3.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mineflayer-26.3-chest-lamp.yml
      - tools/probe_mineflayer_top_place.js
      - tools/probe_mineflayer_top_place_26_3.py

permissions:
  contents: write

concurrency:
  group: experimental-prismarine-chest-lamp-26-3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble qualified experimental Prismarine base stack
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Qualify isolated south-facing chest plus block entity
        id: chest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p probes/mineflayer
          python tools/probe_mineflayer_top_place_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --name chest-south-single \
            --item chest \
            --expected-block chest \
            --expected-state 'minecraft:chest[facing=south,type=single,waterlogged=false]' \
            --expected-properties-json '{"facing":"south","type":"single","waterlogged":"false"}' \
            --bot-yaw 180 \
            --require-block-entity \
            --output probes/mineflayer/26.3-chest-south-single.json

      - name: Qualify unlit redstone lamp placement
        id: lamp
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p probes/mineflayer
          python tools/probe_mineflayer_top_place_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --name redstone-lamp-unlit \
            --item redstone_lamp \
            --expected-block redstone_lamp \
            --expected-state 'minecraft:redstone_lamp[lit=false]' \
            --expected-properties-json '{"lit":"false"}' \
            --bot-yaw 0 \
            --output probes/mineflayer/26.3-redstone-lamp-unlit.json

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Experimental Prismarine / Java 26.3 chest and lamp"
            echo
            for f in \
              probes/mineflayer/26.3-chest-south-single.json \
              probes/mineflayer/26.3-redstone-lamp-unlit.json
            do
              if [[ -f "$f" ]]; then
                echo "### $f"
                echo '~~~json'
                cat "$f"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experimental-prismarine-26.3-chest-lamp
          path: |
            probes/mineflayer/26.3-chest-south-single.json
            probes/mineflayer/26.3-redstone-lamp-unlit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'probe/mineflayer-26.3-chest-lamp'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            probes/mineflayer/26.3-chest-south-single.json \
            probes/mineflayer/26.3-redstone-lamp-unlit.json
          do
            if [[ -f "$f" ]]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record Java 26.3 chest/lamp evidence"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Require both family reps
        if: always()
        shell: bash
        run: |
          test "${{ steps.chest.outcome }}" = "success"
          test "${{ steps.lamp.outcome }}" = "success"
