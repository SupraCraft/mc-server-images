name: Experimental Prismarine Java 26.3 oriented stair placement

on:
  workflow_dispatch:
  push:
    branches:
      - probe/mineflayer-26.3-oriented-stairs
    paths:
      - .github/workflows/mineflayer-26.3-oriented-stairs.yml
      - tools/probe_mineflayer_oriented_26_3.py
      - tools/probe_mineflayer_stairs.js
      - probes/mineflayer-runtime/experimental-stack.json
      - tools/install_experimental_prismarine_26_3.sh
      - tools/apply_mineflayer_tick_end_26_3.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mineflayer-26.3-oriented-stairs.yml
      - tools/probe_mineflayer_oriented_26_3.py
      - tools/probe_mineflayer_stairs.js

permissions:
  contents: write

concurrency:
  group: experimental-prismarine-oriented-26-3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble qualified experimental Prismarine base stack
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Run requested oriented stair placement qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probes/mineflayer
          python tools/probe_mineflayer_oriented_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output probes/mineflayer/26.3-oriented-stairs.json

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          if [[ -f probes/mineflayer/26.3-oriented-stairs.json ]]; then
            {
              echo "## Experimental Prismarine / Java 26.3 oriented stair placement"
              echo
              echo '~~~json'
              cat probes/mineflayer/26.3-oriented-stairs.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experimental-prismarine-26.3-oriented-stairs
          path: probes/mineflayer/26.3-oriented-stairs.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'probe/mineflayer-26.3-oriented-stairs'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f probes/mineflayer/26.3-oriented-stairs.json ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/mineflayer/26.3-oriented-stairs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record Java 26.3 oriented stair placement"
          git push origin "HEAD:$GITHUB_REF_NAME"
