name: G4 Anvil decoder on real Minecraft 26.3 OP-3C stopped regions
on:
  pull_request:
    paths:
      - 'tools/qualify_op3c_real_anvil_decoder_263.py'
      - 'tests/test_qualify_op3c_real_anvil_decoder_263.py'
      - '.github/workflows/qualify-g4-anvil-from-op3c-263.yml'
permissions:
  contents: read
concurrency:
  group: op3c-vanilla-player-world-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-stopped-region-source-diagnostic:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout candidate public producer harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact accepted inner ZIP producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/accepted-producer
          persist-credentials: false
      - name: Checkout exact consumed OP4N-021 public decoder source (no private source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: c0a1cc4dbddc231b57e96a1d3acbfe67fb9c2405
          path: .deps/agent-dispatch
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Independently verify frozen sources and cheap negative controls
        run: |
          set -euo pipefail
          test "$(git -C .deps/accepted-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          test "$(git -C .deps/agent-dispatch rev-parse HEAD)" = c0a1cc4dbddc231b57e96a1d3acbfe67fb9c2405
          python3 -m py_compile tools/qualify_op3c_real_anvil_decoder_263.py
          python3 -m unittest discover -s tests -p 'test_qualify_op3c_real_anvil_decoder_263.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_datapack_player_263.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_world_artifact_activation_263.py' -v
          node --check tools/probe_mineflayer_core_place.js
      - name: Install same pinned Prismarine runtime as OP-3C
        run: |
          set -euo pipefail
          bash tools/install_experimental_prismarine_26_3.sh "$RUNNER_TEMP/prismarine"
          echo "NODE_PATH=$RUNNER_TEMP/prismarine/runtime/node_modules" >> "$GITHUB_ENV"
      - name: Export same exact immutable inner Lantern ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op3c-g4"
          python3 .deps/accepted-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/op3c-g4/lantern.zip" \
            --manifest "$RUNNER_TEMP/op3c-g4/lantern.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
      - name: Existing real Java25/26.3 OP-3C player and exact stopped-region decoder readback
        run: |
          set -euo pipefail
          python3 tools/qualify_op3c_real_anvil_decoder_263.py \
            --candidate "$RUNNER_TEMP/op3c-g4/lantern.zip" \
            --manifest "$RUNNER_TEMP/op3c-g4/lantern.json" \
            --evidence probes/26.3-release-identity.json \
            --out "$RUNNER_TEMP/op3c-g4/sanitized-decoder-receipt.json"
          python3 - "$RUNNER_TEMP/op3c-g4/sanitized-decoder-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="supracraft.op3c-real-vanilla263-g4-anvil-source-qualification/1"
          assert r["real_op3c_player_qualified"] is True
          assert r["decoder_source_ref"]=="c0a1cc4dbddc231b57e96a1d3acbfe67fb9c2405"
          assert r["physical_truenas_apply"]=="HOLD" and r["g4_acceptance"]=="HOLD"
          assert not r["native_truenas_oracle_pass"] and not r["op4o_022_admitted"]
          assert not r["raw_world_bytes_published"] and not r["server_binary_published"]
          assert len(r["stages"])==3
          assert [s["stage"] for s in r["stages"]]==["preaction","candidate","rollback"]
          print("QUALIFICATION STATUS:",r["classification"])
          print("DECODER_ACCEPTED_ALL_THREE:",r["decoder_all_three_stages_qualified"])
          print("BOUNDED_REASONS:",[s["reason"] for s in r["stages"]])
          PY
      - name: Retain only bounded diagnostic code and digest receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op3c-g4-real-263-anvil-decoder-source-diagnostic
          path: ${{ runner.temp }}/op3c-g4/sanitized-decoder-receipt.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve qualification boundary
        if: always()
        run: |
          echo 'Public-$0 real stopped Minecraft26.3 OP3C source-only pinned decoder qualification. No private code, region bytes, TrueNAS download, G4 acceptance, OP4O admission, COLLAGE mutation or physical deployment.' >> "$GITHUB_STEP_SUMMARY"
