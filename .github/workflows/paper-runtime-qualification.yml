name: Paper runtime qualification

on:
  push:
    branches:
      - bootstrap/paper-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  qualify-paper-26-2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAPER_VERSION: "26.2"
      PAPER_BUILD: "123"
      IMAGE_REPOSITORY: ghcr.io/supracraft/mc-server-images/paper
      USER_AGENT: SupraCraft-mc-server-images/0.1 (https://github.com/SupraCraft/mc-server-images)

    steps:
      - uses: actions/checkout@v5

      - name: Resolve exact stable Paper build
        id: paper
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              -H "User-Agent: ${USER_AGENT}" \
              "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds"
          )"

          row="$(
            jq -cer \
              --argjson build "${PAPER_BUILD}" \
              'first(.[] | select(.id == $build and .channel == "STABLE"))' \
              <<<"${response}"
          )"

          url="$(jq -er '.downloads["server:default"].url' <<<"${row}")"
          sha256="$(jq -er '.downloads["server:default"].checksums.sha256' <<<"${row}")"

          test "${#sha256}" -eq 64
          printf 'url=%s\n' "${url}" >> "${GITHUB_OUTPUT}"
          printf 'sha256=%s\n' "${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Build pinned runtime image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="${IMAGE_REPOSITORY}:${PAPER_VERSION}-${PAPER_BUILD}-${short_sha}"

          docker build \
            --file Dockerfile.paper \
            --build-arg "PAPER_VERSION=${PAPER_VERSION}" \
            --build-arg "PAPER_BUILD=${PAPER_BUILD}" \
            --build-arg "PAPER_URL=${{ steps.paper.outputs.url }}" \
            --build-arg "PAPER_SHA256=${{ steps.paper.outputs.sha256 }}" \
            --tag "${tag}" \
            .

          printf '%s\n' "${tag}" > image-tag.txt
          docker image inspect "${tag}" --format '{{.Id}}' > image-id.txt

      - name: Run real Paper startup and clean-stop rep
        shell: bash
        run: |
          set -euo pipefail
          tag="$(cat image-tag.txt)"
          mkdir -p evidence

          cleanup() {
            docker rm -f paper-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name paper-smoke \
            --env EULA=TRUE \
            --env ONLINE_MODE=false \
            --env 'JAVA_OPTS=-Xms512M -Xmx768M' \
            "${tag}" > evidence/container-id.txt

          ready=0
          for _ in $(seq 1 120); do
            docker logs paper-smoke > evidence/server.log 2>&1 || true
            if grep -Eq 'Done \([0-9.]+s\)! For help' evidence/server.log; then
              ready=1
              break
            fi
            if ! docker inspect paper-smoke --format '{{.State.Running}}' | grep -qx true; then
              break
            fi
            sleep 2
          done

          if [ "${ready}" -ne 1 ]; then
            cat evidence/server.log
            echo "Paper did not reach ready state" >&2
            exit 1
          fi

          docker exec paper-smoke java -version > evidence/java-version.txt 2>&1
          grep -Eq 'version "25' evidence/java-version.txt

          docker stop --time 30 paper-smoke >/dev/null
          docker logs paper-smoke > evidence/server.log 2>&1 || true

          grep -Eq 'Done \([0-9.]+s\)! For help' evidence/server.log

          image_id="$(cat image-id.txt)"
          cat > evidence/qualification.json <<JSON
          {
            "schema_version": 1,
            "result": "PASS",
            "paper_version": "${PAPER_VERSION}",
            "paper_build": ${PAPER_BUILD},
            "paper_server_sha256": "${{ steps.paper.outputs.sha256 }}",
            "source_commit": "${GITHUB_SHA}",
            "image_tag": "${tag}",
            "image_id": "${image_id}",
            "java_major": 25,
            "startup_ready": true,
            "clean_stop_requested": true
          }
          JSON

      - name: Publish commit-qualified image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(cat image-tag.txt)"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${tag}"
          docker image inspect "${tag}" --format '{{index .RepoDigests 0}}' \
            > evidence/repo-digest.txt || true

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-qualification-${{ github.run_id }}
          path: |
            evidence/
            image-tag.txt
            image-id.txt
          if-no-files-found: warn
          retention-days: 14
