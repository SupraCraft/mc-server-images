name: OP-3C exact vanilla 26.3 artifact real player action and rollback
on:
  pull_request:
    paths:
      - 'tools/qualify_vanilla_datapack_player_263.py'
      - 'tests/test_qualify_vanilla_datapack_player_263.py'
      - '.github/workflows/qualify-vanilla-263-datapack-player-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: op3c-vanilla-player-world-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-player-causal-world:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact candidate consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact accepted immutable producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/accepted-producer
          persist-credentials: false
      - name: Checkout immutable public Agent Dispatch Anvil decoder (NOT a native request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: 50ee3106116913564b6b57223f30300343f31ac4
          path: .deps/pinned-anvil
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Cheap negative source and producer gates
        run: |
          set -euo pipefail
          test "$(git -C .deps/accepted-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          test "$(git -C .deps/pinned-anvil rev-parse HEAD)" = 50ee3106116913564b6b57223f30300343f31ac4
          python3 -m py_compile tools/qualify_vanilla_datapack_player_263.py
          python3 -m unittest discover -s tests -p 'test_op4n_anvil_decoder_263.py' -v
          (cd .deps/pinned-anvil && python3 -m unittest tests.test_native_vanilla263_anvil_blocks -v)
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_datapack_player_263.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_world_artifact_activation_263.py' -v
          node --check tools/probe_mineflayer_core_place.js
      - name: Install existing pinned experimental 26.3 Prismarine client runtime
        run: |
          set -euo pipefail
          bash tools/install_experimental_prismarine_26_3.sh "$RUNNER_TEMP/prismarine"
          echo "NODE_PATH=$RUNNER_TEMP/prismarine/runtime/node_modules" >> "$GITHUB_ENV"
      - name: Export same exact inner ZIP as OP-3 and COLLAGE
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op3c"
          python3 .deps/accepted-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/op3c/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3c/lantern-restoration-26.3.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
      - name: Live vanilla baseline, real Mineflayer placement, effect, rollback and negative
        run: |
          set -euo pipefail
          python3 tools/qualify_vanilla_datapack_player_263.py \
            --candidate "$RUNNER_TEMP/op3c/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3c/lantern-restoration-26.3.json" \
            --evidence probes/26.3-release-identity.json \
            --out "$RUNNER_TEMP/op3c/player-world-receipt.json" \
            --anvil-decoder-file .deps/pinned-anvil/scripts/qualify_native_vanilla263_anvil_blocks.py
          python3 - "$RUNNER_TEMP/op3c/player-world-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="REAL_OFFLINE_PLAYER_ACTION_CAUSAL_ARTIFACT_AND_ROLLBACK"
          assert r["source_artifact_sha256"]=="da25005e8729e6f013f7108ac5b8869dd46323befc78efdae18221b26cafe5f8"
          assert r["player_caused_datapack_effect"]
          assert r["same_player_action_without_datapack_no_effect"]
          assert r["rollback_exact_snapshot_before_restart"]
          assert r["candidate_player"]["server_join_independently_observed"]
          assert r["postrollback_player"]["server_join_independently_observed"]
          witnesses=r["standalone_stopped_region_witnesses"]
          assert set(witnesses)=={"baseline","candidate","rollback"}
          for stage in ("baseline","candidate","rollback"):
            w=witnesses[stage]
            assert w["schema"]=="supracraft.op4l-019-standalone-stopped-region/1"
            assert w["classification"] in {
              "REGION_FILE_BOUNDED_PRESENT", "REGION_NOT_PRESENT",
              "REGION_NOT_REGULAR_FILE", "REGION_OUT_OF_BOUNDS",
              "REGION_STAT_INCONCLUSIVE"}
            assert w["host_observer_only"] is True
            assert w["region_bytes_published"] is False
            assert w["native_truenas_oracle_pass"] is False
            assert w["g4_three_checkpoint_world_pass"] is False
            assert w["physical_truenas_apply"]=="HOLD"
          dec=r["op4n_pinned_anvil_decoder"]
          assert set(dec)=={"preaction","candidate","rollback"}
          for stage in ("preaction","candidate","rollback"):
            d=dec[stage]
            print("real_26_3_anvil_decoder",stage,d["classification"],d.get("reason","NONE"))
            assert d["native_truenas_g4_pass"] is False
            assert d["classification"]=="STANDALONE_REAL_263_DECODER_MATCH", (stage,d["classification"],d.get("reason","NONE"))
          assert not r["stock_mojang_client_qualified"]
          assert not r["authenticated_account_qualified"]
          assert not r["collage_deployed"]
          assert r["physical_truenas_apply"]=="HOLD"
          assert not r["operational_selection"]
          PY
      - name: Retain only compact public-safe receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op3c-vanilla26-3-player-world-artifact-rollback
          path: ${{ runner.temp }}/op3c/player-world-receipt.json
          retention-days: 14
          if-no-files-found: warn
      - name: Maintain exact scope
        if: always()
        run: |
          echo 'Real offline Mineflayer 26.3 protocol 777 player input and official vanilla server action/effect/rollback. Records host-side stopped Anvil region presence after each real fixture, but does NOT prove TrueNAS middleware stat, three-point G4 backend, stock Mojang client, Microsoft auth, managed actor, Two Rivers, COLLAGE or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
