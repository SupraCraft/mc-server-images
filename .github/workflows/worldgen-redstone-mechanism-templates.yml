name: worldgen redstone mechanism templates

on:
  pull_request:
    branches: [main]
    paths:
      - 'bench/worldgen/observability/redstone-mechanism-reference-catalog-v0.json'
      - 'bench/worldgen/observability/redstone-mechanism-taxonomy-v1.json'
      - 'bench/worldgen/observability/supracraft-redstone-netlist-v1.schema.json'
      - 'tools/run_modern_redstone_template_canary.py'
      - 'tools/validate_modern_redstone_templates.py'
      - 'tools/correlate_redstone_template_netlist.py'
      - 'tools/build_redstone_netlist.py'
      - 'tools/analyze_modern_causal_machinery.py'
      - 'tests/test_redstone_netlist.py'
      - 'tools/causal-microscope/modern-26.3-agent/**'
      - 'tools/causal-microscope/modern-26.4-snapshot-2-agent/**'
      - 'tools/discover_minecraft_observability.py'
      - '.github/workflows/worldgen-redstone-mechanism-templates.yml'
  workflow_dispatch:

concurrency:
  group: worldgen-redstone-mechanism-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: release
            version: "26.3"
            evidence_mode: static
            evidence_path: probes/26.3-release-identity.json
            server_jar: out/server-26.3.jar
            agent_pom: tools/causal-microscope/modern-26.3-agent/pom.xml
            agent_jar: tools/causal-microscope/modern-26.3-agent/target/causal-microscope-modern-agent-0.1.0-SNAPSHOT.jar
            adapter_id: modern-26.3-java25
          - key: snapshot
            version: "26.4-snapshot-2"
            evidence_mode: discovery
            evidence_path: out/discovery/discovery.json
            server_jar: out/discovery/server.jar
            agent_pom: tools/causal-microscope/modern-26.4-snapshot-2-agent/pom.xml
            agent_jar: tools/causal-microscope/modern-26.4-snapshot-2-agent/target/causal-microscope-modern-snapshot-agent-0.1.0-SNAPSHOT.jar
            adapter_id: modern-26.4-snapshot-2-java25

    env:
      WORLDGEN_RUNNER_LABEL: ubuntu-latest

    steps:
      - name: Fail closed outside public standard runners
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.repository.private }}" == "false" ]] || exit 78

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bounded NBT dependency
        run: python -m pip install --disable-pip-version-check nbtlib==2.0.4

      - name: Enforce public/free execution policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_worldgen_public_policy.py \
            --repository-private "${{ github.event.repository.private }}" \
            --runner-label "$WORLDGEN_RUNNER_LABEL" \
            --scan-workflows .github/workflows

      - name: Template contract controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_redstone_netlist
          python -m py_compile \
            tools/run_modern_redstone_template_canary.py \
            tools/validate_modern_redstone_templates.py \
            tools/correlate_redstone_template_netlist.py \
            tools/build_redstone_netlist.py \
            tools/analyze_modern_causal_machinery.py \
            tools/discover_minecraft_observability.py

      - name: Build exact-version observer
        shell: bash
        run: |
          set -euo pipefail
          mvn -q -f "${{ matrix.agent_pom }}" -DskipTests package
          test -s "${{ matrix.agent_jar }}"
          echo "MICROSCOPE_AGENT=$PWD/${{ matrix.agent_jar }}" >> "$GITHUB_ENV"

      - name: Resolve exact snapshot evidence
        if: matrix.evidence_mode == 'discovery'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/discovery
          python tools/discover_minecraft_observability.py probe \
            --channel snapshot \
            --expected-version "${{ matrix.version }}" \
            --expected-java 25 \
            --work-dir out/discovery \
            --output out/discovery/discovery.json

      - name: Run stock standard templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            out/repeater-d1-stock out/repeater-d1-instrumented \
            out/repeater-d4-stock out/repeater-d4-instrumented \
            out/not-gate-stock out/not-gate-instrumented \
            out/or-gate-stock out/or-gate-instrumented \
            out/and-gate-stock out/and-gate-instrumented

          python tools/run_modern_redstone_template_canary.py \
            --evidence "${{ matrix.evidence_path }}" \
            --server-jar "${{ matrix.server_jar }}" \
            --fixture repeater_delay --delay 1 \
            --output-dir out/repeater-d1-stock \
            --expected-version "${{ matrix.version }}"
          python tools/run_modern_redstone_template_canary.py \
            --evidence "${{ matrix.evidence_path }}" \
            --server-jar "${{ matrix.server_jar }}" \
            --fixture repeater_delay --delay 4 \
            --output-dir out/repeater-d4-stock \
            --expected-version "${{ matrix.version }}"
          python tools/run_modern_redstone_template_canary.py \
            --evidence "${{ matrix.evidence_path }}" \
            --server-jar "${{ matrix.server_jar }}" \
            --fixture not_gate \
            --output-dir out/not-gate-stock \
            --expected-version "${{ matrix.version }}"
          python tools/run_modern_redstone_template_canary.py \
            --evidence "${{ matrix.evidence_path }}" \
            --server-jar "${{ matrix.server_jar }}" \
            --fixture or_gate \
            --output-dir out/or-gate-stock \
            --expected-version "${{ matrix.version }}"
          python tools/run_modern_redstone_template_canary.py \
            --evidence "${{ matrix.evidence_path }}" \
            --server-jar "${{ matrix.server_jar }}" \
            --fixture and_gate \
            --output-dir out/and-gate-stock \
            --expected-version "${{ matrix.version }}"

      - name: Run instrumented standard templates
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "repeater_delay:1:repeater-d1" \
            "repeater_delay:4:repeater-d4" \
            "not_gate::not-gate" \
            "or_gate::or-gate" \
            "and_gate::and-gate"; do
            IFS=: read -r fixture delay outname <<< "$spec"
            args=(
              --evidence "${{ matrix.evidence_path }}"
              --server-jar "${{ matrix.server_jar }}"
              --fixture "$fixture"
              --output-dir "out/$outname-instrumented"
              --java-agent "$MICROSCOPE_AGENT"
              --adapter-id "${{ matrix.adapter_id }}"
              --expected-version "${{ matrix.version }}"
            )
            if [[ -n "$delay" ]]; then
              args+=(--delay "$delay")
            fi
            python tools/run_modern_redstone_template_canary.py "${args[@]}"
          done

      - name: Validate exact runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_modern_redstone_templates.py \
            --root out \
            --version "${{ matrix.version }}" \
            --output out/redstone-template-runtime-report.json

      - name: Recover standard template netlists and schematics
        shell: bash
        run: |
          set -euo pipefail
          for fixture in repeater-d1 repeater-d4 not-gate or-gate and-gate; do
            python tools/analyze_modern_causal_machinery.py \
              --world-zip "out/$fixture-stock/world.zip" \
              --output "out/$fixture-machinery.json"
            python tools/build_redstone_netlist.py \
              --graph "out/$fixture-machinery.json" \
              --output "out/$fixture-netlist.json" \
              --dot-output "out/$fixture-functional.dot" \
              --layers-output "out/$fixture-layers.json"
          done

      - name: Correlate structure with runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/correlate_redstone_template_netlist.py \
            --runtime-report out/redstone-template-runtime-report.json \
            --repeater-d1-netlist out/repeater-d1-netlist.json \
            --repeater-d4-netlist out/repeater-d4-netlist.json \
            --not-netlist out/not-gate-netlist.json \
            --or-netlist out/or-gate-netlist.json \
            --and-netlist out/and-gate-netlist.json \
            --output out/redstone-template-netlist-runtime-correlation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redstone-mechanism-templates-${{ matrix.version }}
          path: |
            out/discovery/discovery.json
            out/*-stock/result.json
            out/*-stock/world.zip
            out/*-instrumented/result.json
            out/*-instrumented/trace.jsonl
            out/*-machinery.json
            out/*-netlist.json
            out/*-functional.dot
            out/*-layers.json
            out/redstone-template-runtime-report.json
            out/redstone-template-netlist-runtime-correlation.json
          retention-days: 14
