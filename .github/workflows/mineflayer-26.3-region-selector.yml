name: Vanilla Java 26.3 player-region selector qualification

on:
  workflow_dispatch:
  push:
    branches:
      - probe/mineflayer-26.3-region-selector
    paths:
      - .github/workflows/mineflayer-26.3-region-selector.yml
      - tools/probe_mineflayer_region_selector_26_3.py
      - tools/probe_mineflayer_presence.js
      - tools/smoke_vanilla_runtime.py
      - tools/install_experimental_prismarine_26_3.sh
      - tools/apply_mineflayer_tick_end_26_3.py
      - probes/26.3-release-identity.json
      - probes/mineflayer-runtime/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mineflayer-26.3-region-selector.yml
      - tools/probe_mineflayer_region_selector_26_3.py
      - tools/probe_mineflayer_presence.js

permissions:
  contents: read

concurrency:
  group: mineflayer-26-3-region-selector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          package-manager-cache: false
          node-version: "22"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble pinned experimental Prismarine stack
        shell: bash
        run: |
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Qualify official-server player-region selectors
        shell: bash
        run: |
          mkdir -p out
          python tools/probe_mineflayer_region_selector_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output out/26.3-player-region-selector.json

      - name: Publish compact evidence
        shell: bash
        run: |
          {
            echo "## Minecraft Java 26.3 vanilla player-region selector"
            echo
            echo '~~~json'
            cat out/26.3-player-region-selector.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: true
          name: vanilla-26.3-player-region-selector
          path: out/26.3-player-region-selector.json
          if-no-files-found: error
