name: S4 Paper 26.3 real direct and Velocity-proxied gameplay
on:
  pull_request:
    paths:
      - 'tools/qualify_paper_263_gameplay_adapter.py'
      - 'tests/test_qualify_paper_263_gameplay_adapter.py'
      - '.github/workflows/qualify-paper-263-gameplay-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s4-paper263-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paper-gameplay:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/accepted-producer
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Cheap source and red-blue negatives before runtime
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 -m py_compile tools/qualify_paper_263_gameplay_adapter.py
          python3 -m unittest discover -s tests -p 'test_qualify_paper_263_gameplay_adapter.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_velocity_paper_263_forwarding.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_direct_proxy_263_equivalence.py' -v
          node --check tools/probe_mineflayer_core_place.js
          test "$(git -C .deps/accepted-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
      - name: Install exact inherited experimental Mineflayer 26.3 client
        run: |
          set -euo pipefail
          bash tools/install_experimental_prismarine_26_3.sh "$RUNNER_TEMP/prismarine"
          echo "NODE_PATH=$RUNNER_TEMP/prismarine/runtime/node_modules" >> "$GITHUB_ENV"
      - name: Export exact world artifact and discover official pinned runtimes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s4"
          python3 .deps/accepted-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/s4/lantern.zip" \
            --manifest "$RUNNER_TEMP/s4/lantern.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
          python3 tools/resolve_operational_runtime_versions.py --output "$RUNNER_TEMP/s4/discovery.json"
      - name: Real Paper gameplay, proxy forwarding and two negative treatments
        run: |
          set -euo pipefail
          python3 tools/qualify_paper_263_gameplay_adapter.py \
            --candidate "$RUNNER_TEMP/s4/lantern.zip" \
            --manifest "$RUNNER_TEMP/s4/lantern.json" \
            --discovery "$RUNNER_TEMP/s4/discovery.json" \
            --out "$RUNNER_TEMP/s4/receipt.json"
          python3 - "$RUNNER_TEMP/s4/receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="REAL_PAPER263_GAMEPLAY_ADAPTER_DIRECT_PROXY"
          for k in ("same_world_baseline","direct_and_proxied_effects",
                    "backend_bypass_denied","wrong_secret_denied",
                    "both_worlds_restored","temporary_processes_worlds_secrets_disposed"):
              assert r.get(k) is True,k
          assert r["direct_paper"]["action"]["backend_uuid"]==r["proxied_paper"]["action"]["backend_uuid"]
          assert r["source"]["protocol"]==777 and r["source"]["paper_build"]==177
          assert r["microsoft_auth_qualified"] is False
          assert r["vip_qualified"] is False
          assert r["all_vanilla_semantics_qualified"] is False
          assert r["native_truenas_guest_qualified"] is False
          assert r["operational_selection"] is False
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Retain only sanitized JSON result; never game files, worlds or secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s4-paper263-direct-proxy-gameplay
          path: ${{ runner.temp }}/s4/receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Explicit independent non-promotion scope
        if: always()
        run: echo 'Offline public disposable Paper26.3 gameplay adapter only. No Microsoft auth, VIP, whole-gameplay proof, COLLAGE managed TrueNAS or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
