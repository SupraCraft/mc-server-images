name: H97 independent CLAP acoustic model interview
on:
  pull_request:
    paths:
      - 'tools/interview_clap_audio_h97.py'
      - 'tests/test_h97_clap_audio.py'
      - '.github/workflows/h97-clap-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h97-clap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audio-fixture-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install only deterministic fixture dependency
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Falsify frozen audio control generation
        run: python -B -m unittest discover -s tests -p 'test_h97_clap_audio.py' -v
  clap-cpu:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned zero-key CPU-only runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
          python -m pip install --disable-pip-version-check 'transformers==4.53.3' 'numpy==1.26.4' 'librosa==0.10.2.post1' 'sentencepiece==0.2.1' 'protobuf==5.29.5'
      - name: First immutable CLAP acoustic model interview
        shell: bash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h97-clap"
          python -B tools/interview_clap_audio_h97.py --out "$RUNNER_TEMP/h97-clap/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: h97-clap-first-frozen-acoustic-rep
          path: ${{ runner.temp }}/h97-clap/receipt.json
          retention-days: 3
          if-no-files-found: warn
