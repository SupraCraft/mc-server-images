name: OP-3 real vanilla 26.3 datapack stage, activation and rollback
on:
  pull_request:
    paths:
      - 'tools/qualify_vanilla_world_artifact_activation_263.py'
      - 'tests/test_qualify_vanilla_world_artifact_activation_263.py'
      - '.github/workflows/qualify-vanilla-263-world-artifact-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: op3-vanilla-world-263-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-world:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout exact consumer revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned accepted datapack producer (not mutable main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: producer
          persist-credentials: false
      - name: Preflight source and producer provenance
        run: |
          set -euo pipefail
          test "$(git -C producer rev-parse HEAD)" = '7f888b5829f4e5576d5ce512d86327348c43f01e'
          python3 -m py_compile tools/qualify_vanilla_world_artifact_activation_263.py
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_world_artifact_activation_263.py' -v
          python3 tools/validate_world_activation_transaction.py
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Export immutable inner candidate from exact accepted source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op3"
          python3 producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/op3/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3/lantern-restoration-26.3.json" \
            --world-id lantern-rdte \
            --release-id lantern-core-restore-26-3
      - name: Real server baseline, candidate stage, behavior, rollback and negative oracle
        run: |
          set -euo pipefail
          python3 tools/qualify_vanilla_world_artifact_activation_263.py \
            --candidate "$RUNNER_TEMP/op3/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op3/lantern-restoration-26.3.json" \
            --evidence probes/26.3-release-identity.json \
            --out "$RUNNER_TEMP/op3/activation-receipt.json"
          python3 - "$RUNNER_TEMP/op3/activation-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="REAL_VANILLA_DATAPACK_ACTIVATION_AND_FAULT_ROLLBACK"
          assert r["independent_server_trigger_pass"] is True
          assert r["fault_injection_rollback_pass"] is True
          assert r["rollback_absence_of_datapack_behavior_pass"] is True
          assert r["restored_world_hash"]==r["baseline_world_hash"]
          assert r["physical_truenas_apply"]=="HOLD"
          assert r["operational_selection"] is False and r["collage_deployed"] is False
          PY
      - name: Retain compact nonsecret receipt only (not JAR or world)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op3-vanilla-263-datapack-activation-rollback
          path: ${{ runner.temp }}/op3/activation-receipt.json
          retention-days: 14
          if-no-files-found: warn
      - name: Scope of proof
        if: always()
        run: |
          echo 'Disposable vanilla 26.3 direct world artifact activation/rollback only. No COLLAGE-managed deployment, VanillaCord ingress, Gym player, current-gen TrueNAS, real Two Rivers world or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
