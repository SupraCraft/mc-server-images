name: D3 Exact Server Handler Shape
on:
  workflow_dispatch:
  push:
    branches: [feat/named-place-visual-qualification-v1]
    paths:
      - .github/workflows/d3-handler-shape.yml
      - tools/probe_d3_handler_shape.sh
permissions:
  contents: write
concurrency:
  group: d3-handler-shape-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect checksum-pinned 26.3 method names only
        run: bash tools/probe_d3_handler_shape.sh
      - name: Retain sanitized receipt
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -f probes/active4x/two-rivers-d3-handler-shape.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probes/active4x/two-rivers-d3-handler-shape.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'probe: retain exact 26.3 handler metadata'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
