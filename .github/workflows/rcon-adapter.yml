name: RCON adapter
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rcon-adapter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/probe_rcon_packet.py
      - run: python3 tools/probe_rcon_mock.py
