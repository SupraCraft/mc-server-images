name: OP-4E real offline operator Mineflayer synthetic player commands and datapack rollback
on:
  pull_request:
    paths:
      - 'tools/probe_mineflayer_core_place.js'
      - 'tools/qualify_vanilla_datapack_player_263.py'
      - 'tests/test_vanilla263_operator_bot_setup.py'
      - '.github/workflows/qualify-vanilla-263-operator-bot-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: op4e-synthetic-bot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-operator-player:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SupraCraft/mc-server-images
          ref: 7f888b5829f4e5576d5ce512d86327348c43f01e
          path: .deps/accepted-producer
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Confirm exact original producer and new bounded bot source
        run: |
          set -euo pipefail
          test "$(git -C .deps/accepted-producer rev-parse HEAD)" = 7f888b5829f4e5576d5ce512d86327348c43f01e
          python3 -m py_compile tools/qualify_vanilla_datapack_player_263.py
          python3 -m unittest discover -s tests -p 'test_vanilla263_operator_bot_setup.py' -v
          python3 -m unittest discover -s tests -p 'test_qualify_vanilla_datapack_player_263.py' -v
          node --check tools/probe_mineflayer_core_place.js
      - name: Install exact accepted protocol777 experimental client
        run: |
          set -euo pipefail
          bash tools/install_experimental_prismarine_26_3.sh "$RUNNER_TEMP/prismarine"
          echo "NODE_PATH=$RUNNER_TEMP/prismarine/runtime/node_modules" >> "$GITHUB_ENV"
      - name: Export immutable real Lantern artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op4e"
          python3 .deps/accepted-producer/tools/export_core_restoration_datapack_26_3.py \
            --out "$RUNNER_TEMP/op4e/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op4e/lantern-restoration-26.3.json" \
            --world-id lantern-rdte --release-id lantern-core-restore-26-3
      - name: Offline operator bot commands then real player datapack effect/rollback
        run: |
          set -euo pipefail
          python3 tools/qualify_vanilla_datapack_player_263.py \
            --candidate "$RUNNER_TEMP/op4e/lantern-restoration-26.3.zip" \
            --manifest "$RUNNER_TEMP/op4e/lantern-restoration-26.3.json" \
            --evidence probes/26.3-release-identity.json \
            --operator-setup \
            --out "$RUNNER_TEMP/op4e/player-receipt.json"
          python3 - "$RUNNER_TEMP/op4e/player-receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["classification"]=="REAL_OFFLINE_PLAYER_ACTION_CAUSAL_ARTIFACT_AND_ROLLBACK"
          assert r["operator_bot_fixture_commands_qualified"] is True
          assert r["source_artifact_sha256"]=="da25005e8729e6f013f7108ac5b8869dd46323befc78efdae18221b26cafe5f8"
          assert r["player_caused_datapack_effect"] is True
          assert r["same_player_action_without_datapack_no_effect"] is True
          assert r["rollback_exact_snapshot_before_restart"] is True
          assert r["candidate_player"]["server_join_independently_observed"]
          assert r["postrollback_player"]["server_join_independently_observed"]
          assert not r["authenticated_account_qualified"]
          assert not r["collage_deployed"]
          assert not r["truenas_deployed"]
          assert r["physical_truenas_apply"]=="HOLD"
          PY
      - name: Retain only compact causal/rollback receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: op4e-offline-operator-real-player-datapack-rollback
          path: ${{ runner.temp }}/op4e/player-receipt.json
          retention-days: 14
          if-no-files-found: warn
      - name: Scope guard
        if: always()
        run: echo 'Genuine offline synthetic Bot OP commands plus real player action/rollback. Loopback standalone RDTE only, not stock client, Microsoft auth, native TrueNAS gameplay or physical APPLY.' >> "$GITHUB_STEP_SUMMARY"
