name: Barsoom 26.3 buried harbor official-server oracle
on:
  pull_request:
    paths:
      - 'fixtures/barsoom/archaeology/**'
      - 'tools/qualify_barsoom_archaeology_263.py'
      - '.github/workflows/barsoom-buried-harbor-263.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-native:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
      - name: Static deterministic build gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile fixtures/barsoom/archaeology/build_archive.py tools/qualify_barsoom_archaeology_263.py
          python3 fixtures/barsoom/archaeology/build_archive.py --out "$RUNNER_TEMP/archaeology.zip"
          echo "48238281be8fa315f796d0b23c3d23921f154f68e72f0b1049c12c372d16cb0c  $RUNNER_TEMP/archaeology.zip" | sha256sum -c -
      - name: Native Minecraft 26.3 buried harbor and save-state oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barsoom"
          python3 tools/qualify_barsoom_archaeology_263.py --evidence probes/26.3-release-identity.json --out "$RUNNER_TEMP/barsoom/receipt.json"
      - name: Preserve concise native result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: barsoom-archaeology-263-oracle
          path: ${{ runner.temp }}/barsoom/receipt.json
          retention-days: 14
          if-no-files-found: warn
