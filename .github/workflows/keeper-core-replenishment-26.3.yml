name: Vanilla Java 26.3 automatic keeper core source qualification

on:
  workflow_dispatch:
  push:
    branches:
      - probe/26.3-keeper-core-replenishment
    paths:
      - .github/workflows/keeper-core-replenishment-26.3.yml
      - tools/probe_keeper_core_replenishment_26_3.py
      - tools/probe_mineflayer_auto_recovery_source.js
      - tools/smoke_vanilla_runtime.py
      - tools/install_experimental_prismarine_26_3.sh
      - probes/26.3-release-identity.json
      - probes/mineflayer-runtime/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/keeper-core-replenishment-26.3.yml
      - tools/probe_keeper_core_replenishment_26_3.py
      - tools/probe_mineflayer_auto_recovery_source.js

permissions:
  contents: read

concurrency:
  group: keeper-core-replenishment-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"

      - name: Assemble pinned experimental Prismarine stack
        shell: bash
        run: |
          runtime_root="/tmp/supracraft-prismarine-26.3"
          bash tools/install_experimental_prismarine_26_3.sh "$runtime_root"
          echo "NODE_PATH=$runtime_root/runtime/node_modules" >> "$GITHUB_ENV"

      - name: Qualify automatic keeper replacement source
        shell: bash
        run: |
          mkdir -p out
          python tools/probe_keeper_core_replenishment_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output out/26.3-keeper-core-replenishment.json

      - name: Publish compact evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Minecraft Java 26.3 keeper replacement-core source"
            echo
            if test -f out/26.3-keeper-core-replenishment.json; then
              echo '~~~json'
              cat out/26.3-keeper-core-replenishment.json
              echo '~~~'
            else
              echo "No terminal qualification receipt was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          archive: true
          name: vanilla-26.3-keeper-core-replenishment
          path: out/26.3-keeper-core-replenishment.json
          if-no-files-found: warn
