name: Minecraft 26.3 block catalog coverage

on:
  workflow_dispatch:
  push:
    branches:
      - probe/26.3-block-catalog
    paths:
      - .github/workflows/26.3-block-catalog.yml
      - tools/probe_block_catalog_26_3.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/26.3-block-catalog.yml
      - tools/probe_block_catalog_26_3.py

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Derive runtime and client visual coverage
        shell: bash
        run: |
          mkdir -p probes/block-catalog
          python tools/probe_block_catalog_26_3.py \
            --evidence probes/26.3-release-identity.json \
            --output probes/block-catalog/26.3-summary.json

      - name: Publish compact evidence
        shell: bash
        run: |
          {
            echo "## Minecraft Java 26.3 block catalog"
            echo
            echo '~~~json'
            cat probes/block-catalog/26.3-summary.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-26.3-block-catalog-summary
          path: probes/block-catalog/26.3-summary.json
          if-no-files-found: error

      - name: Retain derived summary on probe branch
        if: github.event_name == 'push' && github.ref_name == 'probe/26.3-block-catalog'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/block-catalog/26.3-summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record 26.3 block catalog summary"
          git push origin "HEAD:$GITHUB_REF_NAME"
