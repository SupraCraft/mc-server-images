name: Mojang release identity probe

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minecraft Java release id
        required: true
        default: "26.3"
  push:
    branches:
      - probe/mojang-release-identity
    paths:
      - .github/workflows/mojang-release-probe.yml
      - tools/probe_mojang_release.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve probe version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="26.3"
          fi
          echo "MC_VERSION=$version" >> "$GITHUB_ENV"

      - name: Probe official Mojang metadata and server artifact
        shell: bash
        run: |
          python tools/probe_mojang_release.py "$MC_VERSION"             --output "probes/$MC_VERSION-release-identity.json"

      - name: Publish compact evidence to job summary
        shell: bash
        run: |
          {
            echo "## Minecraft $MC_VERSION official release identity"
            echo
            echo '~~~json'
            cat "probes/$MC_VERSION-release-identity.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain proving result on probe branch
        if: github.event_name == 'push' && github.ref_name == 'probe/mojang-release-identity'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "probes/$MC_VERSION-release-identity.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "probe: record Mojang $MC_VERSION release identity"
          git push origin "HEAD:$GITHUB_REF_NAME"
