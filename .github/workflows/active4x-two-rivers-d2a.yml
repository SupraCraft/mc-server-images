name: Active 4X Two Rivers D2A Staging Stack

on:
  workflow_dispatch:
  push:
    branches:
      - feat/named-place-visual-qualification-v1
    paths:
      - '.github/workflows/active4x-two-rivers-d2a.yml'
      - 'deploy/active4x-two-rivers/d2a/**'
      - 'tools/probe_active4x_two_rivers_d2a.sh'
      - 'tools/active4x_persistence_w5.py'

permissions:
  contents: write

concurrency:
  group: active4x-two-rivers-d2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-rivers-d2a:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - name: Qualify persistent staging lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash tools/probe_active4x_two_rivers_d2a.sh             probes/active4x/two-rivers-d2a-result.json

      - name: Publish compact receipt
        if: always()
        shell: bash
        run: |
          if [[ -f probes/active4x/two-rivers-d2a-result.json ]]; then
            {
              echo '## Two Rivers active 4X D2A staging stack'
              echo
              echo '~~~json'
              cat probes/active4x/two-rivers-d2a-result.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain compact evidence
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/named-place-visual-qualification-v1'
        shell: bash
        run: |
          set -euo pipefail
          test -f probes/active4x/two-rivers-d2a-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/active4x/two-rivers-d2a-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe: retain Two Rivers D2A staging evidence"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
