name: worldgen programmable chain structure 26.3
on:
  push:
    branches: [feat/programmable-chain-structure-263]
    paths:
      - 'tools/inspect_programmable_chain_structure.py'
      - 'tests/test_programmable_chain_structure.py'
      - '.github/workflows/worldgen-programmable-chain-structure-263.yml'
permissions: {contents: read}
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {WORLDGEN_RUNNER_LABEL: ubuntu-latest}
    steps:
      - name: Fail closed outside public standard runners
        run: '[[ "${{ github.event.repository.private }}" == "false" ]] || exit 78'
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Enforce public/free policy
        run: python tools/check_worldgen_public_policy.py --repository-private "${{ github.event.repository.private }}" --runner-label "$WORLDGEN_RUNNER_LABEL" --scan-workflows .github/workflows
      - run: python -m unittest -v tests.test_programmable_chain_structure
      - run: |
          mkdir -p out
          python tools/inspect_programmable_chain_structure.py --work-dir out/runtime --output out/programmable-chain-structure.json
      - uses: actions/upload-artifact@v4
        with:
          name: programmable-chain-structure-26.3
          path: out/programmable-chain-structure.json
          retention-days: 14
